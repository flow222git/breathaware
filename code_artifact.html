<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>勞務報酬系統 - 專業單機版</title>
<style>
  :root {
    --ink: #1c2330;
    --ink-soft: #55607a;
    --line: #dfe3ea;
    --line-soft: #eef0f5;
    --bg: #f5f6f9;
    --card: #fff;
    --accent: #2f6df0;
    --accent-soft: #eaf1ff;
    --danger: #d8453a;
    --success: #1f7a52;
    --warning: #f6b21a;
  }
  
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  
  body {
    margin: 0;
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    color: var(--ink);
    background: var(--bg);
    font-size: 15px;
    line-height: 1.55;
  }

  button {
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  
  input, select, textarea {
    font-family: inherit;
    font-size: 14px;
    transition: all 0.2s ease;
  }

  .app {
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 20px 80px;
  }
  
  header.bar {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 24px 0 16px;
  }
  
  .logo {
    display: flex;
    gap: 3px;
  }
  
  .logo span {
    width: 11px;
    height: 11px;
    border-radius: 2px;
    display: block;
  }
  
  .logo .a { background: #e8453c; }
  .logo .b { background: #34a853; }
  .logo .c { background: #2f6df0; }
  .logo .d { background: #f6b21a; }
  
  header.bar h1 {
    font-size: 20px;
    margin: 0;
    font-weight: 700;
  }
  
  header.bar small {
    color: var(--ink-soft);
    font-weight: 400;
    margin-left: 6px;
    display: inline-block;
  }
  
  .tabs {
    display: flex;
    gap: 6px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 22px;
    overflow-x: auto;
    white-space: nowrap;
  }
  
  .tabs button {
    background: none;
    border: none;
    padding: 12px 6px;
    margin-right: 20px;
    font-size: 15px;
    color: var(--ink-soft);
    border-bottom: 2px solid transparent;
    font-weight: 600;
  }
  
  .tabs button.on {
    color: var(--ink);
    border-bottom-color: var(--accent);
  }
  
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 24px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.03);
  }
  
  .toolbar {
    display: flex;
    gap: 12px;
    align-items: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  
  .toolbar input.search {
    flex: 1;
    min-width: 220px;
    padding: 10px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
  }
  
  .btn {
    padding: 10px 16px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    font-weight: 600;
    font-size: 14px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 40px;
  }
  
  .btn:hover {
    border-color: #c3cad6;
    background: #fdfdfd;
  }
  
  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  
  .btn.primary:hover {
    background: #255cd6;
    border-color: #255cd6;
  }
  
  .btn.ghost {
    background: none;
    border-color: transparent;
    color: var(--accent);
    padding: 6px 8px;
    min-height: unset;
  }
  
  .btn.ghost:hover {
    background: var(--accent-soft);
  }
  
  .btn.sm {
    padding: 6px 12px;
    font-size: 13px;
    min-height: 32px;
  }
  
  .btn.del {
    color: var(--danger);
  }
  
  .btn.del:hover {
    background: #fff5f5;
    border-color: #f5c2c2;
  }

  .table-responsive {
    overflow-x: auto;
    width: 100%;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    min-width: 600px;
  }
  
  th, td {
    text-align: left;
    padding: 12px 14px;
    border-bottom: 1px solid var(--line-soft);
    font-size: 14px;
  }
  
  th {
    color: var(--ink-soft);
    font-weight: 600;
    font-size: 13px;
    background: #fafafc;
  }
  
  tr:hover td {
    background: #fafbfd;
  }
  
  .tag {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
  }
  
  .tag.local {
    background: #eaf6ef;
    color: var(--success);
  }
  
  .tag.foreign {
    background: #fdeee9;
    color: #b4503f;
  }
  
  .muted {
    color: var(--ink-soft);
  }
  
  .num {
    font-variant-numeric: tabular-nums;
    text-align: right;
  }
  
  .empty {
    text-align: center;
    color: var(--ink-soft);
    padding: 56px 10px;
    font-size: 15px;
  }

  .mask {
    position: fixed;
    inset: 0;
    background: rgba(20, 26, 40, 0.5);
    display: none;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 16px;
    z-index: 100;
    overflow: auto;
    backdrop-filter: blur(2px);
  }
  
  .mask.show {
    display: flex;
  }
  
  .modal {
    background: #fff;
    border-radius: 14px;
    width: 100%;
    max-width: 680px;
    padding: 28px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    animation: modalShow 0.25s ease-out;
  }

  @keyframes modalShow {
    from { transform: translateY(15px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  
  .modal h2 {
    margin: 0 0 20px;
    font-size: 19px;
    font-weight: 700;
  }
  
  .grid2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  
  .fld {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  
  .fld.full {
    grid-column: 1 / -1;
  }
  
  .fld label {
    font-size: 13px;
    color: var(--ink-soft);
    font-weight: 600;
  }
  
  .fld input, .fld select, .fld textarea {
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    color: var(--ink);
  }
  
  .fld input:focus, .fld select:focus, .fld textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  
  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    margin-top: 26px;
  }
  
  .issue-grid {
    display: grid;
    grid-template-columns: 1.1fr 0.9fr;
    gap: 24px;
  }
  
  @media(max-width: 820px) {
    .issue-grid, .grid2 {
      grid-template-columns: 1fr;
    }
  }
  
  .calc {
    background: #fafbfd;
    border: 1px solid var(--line-soft);
    border-radius: 10px;
    padding: 18px;
  }
  
  .calc h3 {
    margin: 0 0 12px;
    font-size: 14px;
    color: var(--ink-soft);
    font-weight: 700;
  }
  
  .calc .line {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px dashed var(--line);
    font-size: 14px;
  }
  
  .calc .line:last-child {
    border-bottom: none;
  }
  
  .calc .line.total {
    font-weight: 700;
    font-size: 18px;
    border-top: 2px solid var(--ink);
    margin-top: 8px;
    padding-top: 12px;
    color: var(--accent);
  }
  
  .calc .deduct .v {
    color: var(--danger);
  }
  
  .hint {
    font-size: 13px;
    color: var(--ink-soft);
    margin-top: 10px;
    line-height: 1.5;
  }
  
  .cap {
    font-size: 13.5px;
    color: var(--accent);
    font-weight: 600;
    margin-top: 6px;
  }

  #receiptWrap {
    display: none;
    background: #fff;
    padding: 20px;
    min-height: 100vh;
  }
  
  .receipt {
    width: 100%;
    max-width: 1040px;
    background: #fff;
    color: #000;
    border: 2px solid #000;
    font-size: 12px;
    line-height: 1.4;
    margin: 0 auto;
  }
  
  .receipt .rhead {
    display: grid;
    grid-template-columns: 240px 1fr 140px;
    align-items: center;
    border-bottom: 2px solid #000;
  }
  
  .receipt .rhead .lg {
    padding: 10px 12px;
  }
  
  .receipt .rhead .lg .blocks {
    display: flex;
    gap: 3px;
    margin-bottom: 4px;
  }
  
  .receipt .rhead .lg .blocks i {
    width: 14px;
    height: 14px;
    display: block;
    border-radius: 2px;
  }
  
  .receipt .rhead .lg small {
    font-size: 9px;
    color: #333;
    display: block;
  }
  
  .receipt .rhead .ttl {
    text-align: center;
    font-size: 24px;
    font-weight: 800;
    letter-spacing: 4px;
  }
  
  .receipt .rhead .dt {
    text-align: right;
    padding: 10px 12px;
    font-size: 11px;
  }
  
  .rtable {
    width: 100%;
    border-collapse: collapse;
  }
  
  .rtable td {
    border: 1px solid #000;
    padding: 8px 10px;
    height: 36px;
  }
  
  .rtable td.lbl {
    background: #f2f2f2;
    font-weight: 700;
    width: 100px;
    white-space: nowrap;
    text-align: center;
  }
  
  .line-field {
    border: 1px solid #000;
    border-top: none;
    padding: 10px 12px;
    font-size: 13px;
  }
  
  .line-field b {
    display: inline-block;
    min-width: 90px;
  }
  
  .line-field .u {
    border-bottom: 1px solid #000;
    padding: 0 8px;
    font-weight: 700;
  }
  
  .mid {
    display: grid;
    grid-template-columns: 1fr 1.15fr;
    border: 1px solid #000;
    border-top: none;
  }
  
  .mid .left {
    border-right: 1px solid #000;
    padding: 16px 12px;
  }
  
  .mid .left .pay .u {
    border-bottom: 1px solid #000;
    padding: 2px 6px;
    display: inline-block;
    min-width: 200px;
    font-size: 16px;
    font-weight: 700;
  }
  
  .mid .left .real {
    margin-top: 20px;
  }
  
  .mid .left .real .boxline {
    font-size: 15px;
    font-weight: 700;
    margin-top: 6px;
    line-height: 1.6;
  }
  
  .mid .right {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }
  
  .mid .right .col {
    padding: 12px 12px;
  }
  
  .mid .right .col:first-child {
    border-right: 1px solid #000;
  }
  
  .mid .right .col .ck {
    font-weight: 700;
    font-size: 13px;
    margin-bottom: 8px;
  }
  
  .mid .right .col .ded {
    margin: 6px 0 2px;
    font-size: 11px;
  }
  
  .mid .right .col .ded .u {
    border-bottom: 1px solid #000;
    padding: 0 6px;
    display: inline-block;
    min-width: 96px;
    font-weight: 700;
  }
  
  .mid .right .col .note {
    color: #d11;
    font-size: 10px;
    line-height: 1.35;
    margin-bottom: 8px;
  }
  
  .box {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 1.5px solid #000;
    vertical-align: -2px;
    margin-right: 6px;
    text-align: center;
    line-height: 11px;
    font-weight: 800;
  }
  
  .box.on::after {
    content: "✓";
    font-size: 12px;
    position: relative;
    top: -2px;
  }
  
  .rfoot {
    display: grid;
    grid-template-columns: 1fr 240px;
    border: 1px solid #000;
    border-top: none;
  }
  
  .rfoot .notes {
    padding: 10px 12px;
    font-size: 10.5px;
    line-height: 1.6;
    border-right: 1px solid #000;
  }
  
  .rfoot .notes .inc {
    margin-top: 6px;
    font-weight: 700;
  }
  
  .rfoot .sign {
    padding: 10px 12px;
  }
  
  .rfoot .sign .who {
    font-weight: 700;
    margin-bottom: 6px;
  }
  
  .rver {
    text-align: right;
    font-size: 9px;
    color: #444;
    padding: 4px 6px 0;
  }

  .dialog-mask {
    position: fixed;
    inset: 0;
    background: rgba(20, 26, 40, 0.6);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 200;
    padding: 16px;
    backdrop-filter: blur(2px);
  }
  
  .dialog-box {
    background: #fff;
    border-radius: 12px;
    width: 100%;
    max-width: 400px;
    padding: 24px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    text-align: center;
    animation: dialogShow 0.2s ease-out;
  }

  @keyframes dialogShow {
    from { transform: scale(0.95); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  
  .dialog-box h3 {
    margin: 0 0 12px;
    font-size: 17px;
    font-weight: 700;
  }
  
  .dialog-box p {
    margin: 0 0 20px;
    font-size: 14.5px;
    color: var(--ink-soft);
    line-height: 1.5;
  }
  
  .dialog-actions {
    display: flex;
    justify-content: center;
    gap: 12px;
  }

  /* 列印排版最佳化 */
  @media print {
    body {
      background: #fff;
    }
    .app, .mask, .dialog-mask {
      display: none !important;
    }
    #receiptWrap {
      display: block !important;
      padding: 0 !important;
    }
    .receipt-actions {
      display: none !important;
    }
    .receipt {
      width: 100%;
      border: 2px solid #000;
    }
    @page {
      size: A4 landscape;
      margin: 8mm;
    }
  }
</style>
</head>
<body>

<div class="app">
  <header class="bar">
    <div class="logo">
      <span class="a"></span>
      <span class="b"></span>
      <span class="c"></span>
      <span class="d"></span>
    </div>
    <h1>勞務報酬系統 <small>人員管理 · 代扣試算 · 收據列印</small></h1>
  </header>
  
  <div class="tabs">
    <button id="tabPeople" class="on" onclick="switchTab('people')">人員管理</button>
    <button id="tabIssue" onclick="switchTab('issue')">開立勞務單</button>
    <button id="tabRecords" onclick="switchTab('records')">開單紀錄</button>
  </div>

  <section id="viewPeople">
    <div class="card">
      <div class="toolbar">
        <input class="search" id="search" placeholder="搜尋姓名 / 身份證 / 工作卡號…" oninput="renderPeople()">
        <button class="btn primary" onclick="openForm()">＋ 新增人員</button>
      </div>
      <div class="table-responsive">
        <div id="peopleTable"></div>
      </div>
    </div>
  </section>

  <section id="viewIssue" style="display:none;">
    <div class="card">
      <div class="issue-grid">
        <div>
          <div class="fld" style="margin-bottom:14px;">
            <label>選擇人員</label>
            <select id="isPerson" onchange="fillFromPerson()"></select>
          </div>
          <div class="grid2">
            <div class="fld">
              <label>填單日期</label>
              <input type="date" id="isFillDate">
            </div>
            <div class="fld">
              <label>工作結案日期</label>
              <input type="date" id="isEndDate">
            </div>
            <div class="fld full">
              <label>領款事由 / 工作內容</label>
              <textarea id="isReason" rows="2" placeholder="請輸入承攬工作內容項目..."></textarea>
            </div>
            <div class="fld">
              <label>應付總金額 NT$</label>
              <input type="number" id="isAmount" oninput="recalc()" placeholder="請輸入應付金額，例如: 35000">
            </div>
            <div class="fld">
              <label>所得類別</label>
              <select id="isIncome" onchange="recalc()">
                <option value="9A-90">執行業務-其他 (9A-90)</option>
                <option value="9A-70">執行業務-表演 (9A-70)</option>
                <option value="9B">稿費 (9B)</option>
              </select>
            </div>
          </div>
          <div class="hint" id="personMeta"></div>
        </div>
        <div>
          <div class="calc">
            <h3>代扣試算（依身份別自動計算）</h3>
            <div class="line"><span>應付總金額</span><span class="v" id="cAmount">—</span></div>
            <div class="line deduct"><span id="cTaxLbl">代扣所得稅</span><span class="v" id="cTax">—</span></div>
            <div class="line deduct"><span>代扣二代健保 2.11%</span><span class="v" id="cNhi">—</span></div>
            <div class="line total"><span>實領金額</span><span class="v" id="cReal">—</span></div>
            <div class="cap" id="cCap"></div>
          </div>
          <div style="margin-top:16px;display:flex;gap:10px;">
            <button class="btn primary" onclick="generate()">產生收據</button>
            <button class="btn" onclick="storeRecord()">存入紀錄</button>
          </div>
          <div class="hint">稅額四捨五入到元；本國加入工會並附證明者免扣健保。外籍人士如無健保則免代扣健保費。「存入紀錄」會存入至「開單紀錄」分頁。</div>
        </div>
      </div>
    </div>
  </section>

  <section id="viewRecords" style="display:none;">
    <div class="card">
      <div class="toolbar">
        <input class="search" id="rSearch" placeholder="搜尋姓名 / 事由…" oninput="renderRecords()">
        <button class="btn" onclick="exportCSV()">匯出 CSV</button>
      </div>
      <div class="table-responsive">
        <div id="recordsTable"></div>
      </div>
    </div>
  </section>
</div>

<div class="mask" id="formMask">
  <div class="modal">
    <h2 id="formTitle">新增人員</h2>
    <input type="hidden" id="fId">
    <div class="grid2">
      <div class="fld"><label>中文姓名 *</label><input id="fName" placeholder="王小明"></div>
      <div class="fld"><label>英文名字</label><input id="fEn" placeholder="John Doe"></div>
      <div class="fld"><label>身份證 / 護照字號 *</label><input id="fId2" placeholder="A123456789"></div>
      <div class="fld"><label>工作卡號</label><input id="fCard" placeholder="如：PR-001"></div>
      <div class="fld"><label>手機 / 電話</label><input id="fPhone" placeholder="0912345678"></div>
      <div class="fld"><label>E-mail</label><input id="fEmail" placeholder="service@example.com"></div>
      <div class="fld full"><label>戶籍地址</label><input id="fAddr" placeholder="台北市中正區重慶南路一段1號"></div>
      <div class="fld"><label>身份別</label>
        <select id="fType" onchange="toggleFormUnionNhi()">
          <option value="本國人士">本國人士</option>
          <option value="外籍人士">外籍人士</option>
        </select>
      </div>
      <div class="fld"><label>所得類別（預設）</label>
        <select id="fIncome">
          <option value="9A-90">執行業務-其他 (9A-90)</option>
          <option value="9A-70">執行業務-表演 (9A-70)</option>
          <option value="9B">稿費 (9B)</option>
        </select>
      </div>
      <div class="fld" id="fUnionContainer"><label>是否加入工會</label>
        <select id="fUnion">
          <option value="否">否</option>
          <option value="是">是</option>
        </select>
      </div>
      <div class="fld"><label>是否投保健保</label>
        <select id="fNhi">
          <option value="是">是</option>
          <option value="否">否</option>
        </select>
      </div>
      <div class="fld"><label>銀行名稱</label><input id="fBank" placeholder="臺灣銀行 004"></div>
      <div class="fld"><label>分行名稱</label><input id="fBranch" placeholder="城中分行"></div>
      <div class="fld full"><label>銀行帳號</label><input id="fAcct" placeholder="01234567890123"></div>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeForm()">取消</button>
      <button class="btn primary" onclick="savePerson()">儲存</button>
    </div>
  </div>
</div>

<div id="receiptWrap">
  <div class="receipt-actions">
    <button class="btn" onclick="backFromReceipt()">← 返回系統</button>
    <button class="btn primary" onclick="window.print()">直接列印 / 另存 PDF</button>
  </div>
  <div class="receipt" id="receipt"></div>
</div>

<div class="dialog-mask" id="customDialog">
  <div class="dialog-box">
    <h3 id="dialogTitle">通知</h3>
    <p id="dialogMsg">這是通知內容</p>
    <div class="dialog-actions">
      <button id="dialogCancelBtn" class="btn">取消</button>
      <button id="dialogConfirmBtn" class="btn primary">確定</button>
    </div>
  </div>
</div>

<script>
const KEY = "labor_people_v1";
const RKEY = "labor_records_v1";

let people = load(KEY) || seed();
let records = load(RKEY) || [];

function load(k) {
  try {
    return JSON.parse(localStorage.getItem(k));
  } catch(e) {
    return null;
  }
}

function save() {
  localStorage.setItem(KEY, JSON.stringify(people));
  localStorage.setItem(RKEY, JSON.stringify(records));
}

function seed() {
  return [
    {
      id: uid(),
      name: "詹姆士",
      en: "James",
      pid: "A123456789",
      card: "IT-001",
      phone: "0912-345-678",
      email: "james@example.com",
      addr: "台北市信義區信義路五段7號",
      type: "本國人士",
      income: "9A-90",
      union: "否",
      nhi: "是",
      bank: "玉山銀行 808",
      branch: "信義分行",
      acct: "0123-456-78901"
    }
  ];
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

function customAlert(message) {
  return new Promise(resolve => {
    document.getElementById('dialogTitle').textContent = '系統提示';
    document.getElementById('dialogMsg').textContent = message;
    document.getElementById('dialogCancelBtn').style.display = 'none';
    
    const confirmBtn = document.getElementById('dialogConfirmBtn');
    confirmBtn.className = 'btn primary';
    confirmBtn.textContent = '確定';
    
    const dialog = document.getElementById('customDialog');
    dialog.style.display = 'flex';
    
    confirmBtn.onclick = () => {
      dialog.style.display = 'none';
      resolve(true);
    };
  });
}

function customConfirm(message) {
  return new Promise(resolve => {
    document.getElementById('dialogTitle').textContent = '確認執行';
    document.getElementById('dialogMsg').textContent = message;
    
    const cancelBtn = document.getElementById('dialogCancelBtn');
    cancelBtn.style.display = 'inline-block';
    cancelBtn.textContent = '取消';
    
    const confirmBtn = document.getElementById('dialogConfirmBtn');
    confirmBtn.className = 'btn primary';
    confirmBtn.textContent = '確定';
    
    const dialog = document.getElementById('customDialog');
    dialog.style.display = 'flex';
    
    confirmBtn.onclick = () => {
      dialog.style.display = 'none';
      resolve(true);
    };
    cancelBtn.onclick = () => {
      dialog.style.display = 'none';
      resolve(false);
    };
  });
}

function switchTab(t) {
  ['people', 'issue', 'records'].forEach(k => {
    document.getElementById('view' + cap1(k)).style.display = (k === t) ? 'block' : 'none';
    document.getElementById('tab' + cap1(k)).classList.toggle('on', k === t);
  });
  if (t === 'issue') refreshPersonSelect();
  if (t === 'records') renderRecords();
}

function cap1(s) {
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function toggleFormUnionNhi() {
  const type = document.getElementById('fType').value;
  const unionContainer = document.getElementById('fUnionContainer');
  if (type === '外籍人士') {
    unionContainer.style.display = 'none';
    document.getElementById('fUnion').value = '否';
  } else {
    unionContainer.style.display = 'flex';
  }
}

function renderPeople() {
  const q = (document.getElementById('search').value || '').toLowerCase();
  const list = people.filter(p => !q || [p.name, p.en, p.pid, p.card].join(' ').toLowerCase().includes(q));
  const el = document.getElementById('peopleTable');
  
  if (!list.length) {
    el.innerHTML = '<div class="empty">沒有符合的人員。點選「＋ 新增人員」建立第一筆。</div>';
    return;
  }
  
  let h = '<table><thead><tr><th>姓名</th><th>身份證/護照</th><th>工作卡號</th><th>身份別</th><th>銀行帳號</th><th></th></tr></thead><tbody>';
  list.forEach(p => {
    const t = p.type === '外籍人士' ? '<span class="tag foreign">外籍</span>' : '<span class="tag local">本國</span>';
    h += `<tr><td><b>${esc(p.name)}</b> <span class="muted">${esc(p.en || '')}</span></td>
      <td>${esc(p.pid)}</td><td>${esc(p.card || '—')}</td><td>${t}</td>
      <td class="muted">${esc(p.bank || '')} ${esc(p.acct || '')}</td>
      <td style="text-align:right;white-space:nowrap;">
        <button class="btn ghost sm" onclick="useForIssue('${p.id}')">開單</button>
        <button class="btn ghost sm" onclick="openForm('${p.id}')">編輯</button>
        <button class="btn ghost sm del" onclick="delPerson('${p.id}')">刪除</button></td></tr>`;
  });
  el.innerHTML = h + '</tbody></table>';
}

function esc(s) {
  return (s == null ? '' : String(s)).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

function openForm(id) {
  const p = id ? people.find(x => x.id === id) : null;
  document.getElementById('formTitle').textContent = p ? '編輯人員資訊' : '新增勞務人員';
  document.getElementById('fId').value = p ? p.id : '';
  set('fName', p && p.name);
  set('fEn', p && p.en);
  set('fId2', p && p.pid);
  set('fCard', p && p.card);
  set('fPhone', p && p.phone);
  set('fEmail', p && p.email);
  set('fAddr', p && p.addr);
  document.getElementById('fType').value = (p && p.type) || '本國人士';
  document.getElementById('fIncome').value = (p && p.income) || '9A-90';
  document.getElementById('fUnion').value = (p && p.union) || '否';
  document.getElementById('fNhi').value = (p && p.nhi) || '是';
  set('fBank', p && p.bank);
  set('fBranch', p && p.branch);
  set('fAcct', p && p.acct);

}

function set(id, v) {
  document.getElementById(id).value = v || '';
}

function gv(id) {
  return document.getElementById(id).value.trim();
}

function closeForm() {
  document.getElementById('formMask').classList.remove('show');
}

async function savePerson() {
  const name = gv('fName');
  const pid = gv('fId2');
  if (!name || !pid) {
    await customAlert('請填寫中文姓名與身份證/護照字號！');
    return;
  }
  const id = gv('fId');
  const data = {
    id: id || uid(),
    name,
    en: gv('fEn'),
    pid,
    card: gv('fCard'),
    phone: gv('fPhone'),
    email: gv('fEmail'),
    addr: gv('fAddr'),
    type: gv('fType'),
    income: gv('fIncome'),
    union: gv('fUnion'),
    nhi: gv('fNhi'),
    bank: gv('fBank'),
    branch: gv('fBranch'),
    acct: gv('fAcct')

  if (id) {
    people = people.map(p => p.id === id ? data : p);
  } else {
    people.push(data);

  closeForm();

}

async function delPerson(id) {
  const p = people.find(x => x.id === id);
  const ok = await customConfirm(`確定刪除「${p.name}」？此操作無法恢復。`);
  if (ok) {
    people = people.filter(x => x.id !== id);

    refreshPersonSelect();

}

  s.innerHTML = '<option value="">— 請選擇領款人員 —</option>' + people.map(p => `<option value="${p.id}">${esc(p.name)} ${esc(p.en || '')} (${esc(p.pid)})</option>`).join('');
  if (people.find(p => p.id === cur)) s.value = cur;
}

function useForIssue(id) {
  switchTab('issue');
  document.getElementById('isPerson').value = id;
  fillFromPerson();
}

function curPerson() {
  return people.find(p => p.id === document.getElementById('isPerson').value);
}

function fillFromPerson() {
  const p = curPerson();
  if (p) {
    document.getElementById('isIncome').value = p.income || '9A-90';
    document.getElementById('personMeta').innerHTML = `身份別：<b>${p.type}</b>　工會：${p.union}　健保投保：${p.nhi}　戶籍地：${esc(p.addr || '—')}`;
  } else {
    document.getElementById('personMeta').innerHTML = '';
  }
  recalc();
}

const roundFn = Math.round;

function calcDeduction(p, amount) {
  let tax = 0, nhi = 0, taxLabel = '代扣所得稅';
  if (!p || !amount) return { tax: 0, nhi: 0, real: amount || 0, taxLabel };
  
  if (p.type === '外籍人士') {
    taxLabel = '代扣 20% 所得稅';
    tax = roundFn(amount * 0.20);
    // 外籍人士若無在台投保健保，則不代扣健保費
    if (amount >= 20000 && p.nhi === '是') {
      nhi = roundFn(amount * 0.0211);
    }
  } else {
    taxLabel = '代扣 10% 所得稅';
    if (amount >= 20010) tax = roundFn(amount * 0.10);
    if (amount >= 20000 && p.union !== '是') {
      nhi = roundFn(amount * 0.0211);
    }
  }
  return { tax, nhi, real: amount - tax - nhi, taxLabel };
}

function recalc() {
  const p = curPerson();
  const amt = parseFloat(document.getElementById('isAmount').value) || 0;
  const d = calcDeduction(p, amt);
  
  document.getElementById('cAmount').textContent = amt ? money(amt) : '—';
  document.getElementById('cTaxLbl').textContent = d.taxLabel;
  document.getElementById('cTax').textContent = d.tax ? '- ' + money(d.tax) : '—';
  document.getElementById('cNhi').textContent = d.nhi ? '- ' + money(d.nhi) : '—';
  document.getElementById('cReal').textContent = amt ? money(d.real) : '—';
  document.getElementById('cCap').textContent = amt ? ('新台幣 ' + capAmount(d.real)) : '';
}

function money(n) {
  return 'NT$ ' + Math.round(n).toLocaleString('en-US');
}

const CAP = ['零', '壹', '貳', '參', '肆', '伍', '陸', '柒', '捌', '玖'];

function capInt(n) {
  if (n === 0) return '';
  let u = ['', '拾', '佰', '仟'], i = 0, arr = [];
  while (n > 0) {
    arr.unshift({ d: n % 10, u: u[i++] });
    n = Math.floor(n / 10);
  }
  let s = '';
  arr.forEach(x => {
    s += (x.d === 0 ? '零' : CAP[x.d] + x.u);
  });
  return s.replace(/零+/g, '零').replace(/零$/, '');
}

function capAmount(n) {
  n = Math.round(n);
  if (n <= 0) return '零元整';
  const wan = Math.floor(n / 10000), rest = n % 10000;
  let s = '';
  if (wan > 0) s += capInt(wan) + '萬';
  if (rest > 0) {
    if (wan > 0 && rest < 1000) s += '零';
    s += capInt(rest);
  }
  return s + '元整';
}

function capBoxes(n) {
  n = Math.round(n);
  return {
    wan: Math.floor(n / 10000) > 0 ? capInt(Math.floor(n / 10000)) : '零',
    tho: CAP[Math.floor(n / 1000) % 10],
    hun: CAP[Math.floor(n / 100) % 10],
    ten: CAP[Math.floor(n / 10) % 10],
    units: CAP[n % 10]
  };
}

async function generate() {

async function storeRecord() {
  const p = curPerson();
  const amt = parseFloat(document.getElementById('isAmount').value) || 0;
  if (!p || !amt) {
    await customAlert('請選擇人員並輸入有效金額！');
    return;
  }
  const d = calcDeduction(p, amt);
  records.push({
    id: uid(),
    fillDate: document.getElementById('isFillDate').value,
    endDate: document.getElementById('isEndDate').value,
    personId: p.id,
    name: p.name,
    pid: p.pid,
    reason: document.getElementById('isReason').value,
    amount: amt,
    type: p.type,
    income: document.getElementById('isIncome').value,
    tax: d.tax,
    nhi: d.nhi,
    real: d.real
  });
  save();
  await customAlert(`已成功存入開單紀錄！（目前共 ${records.length} 筆）`);
  renderRecords();
}

function renderRecords() {
  const q = (document.getElementById('rSearch').value || '').toLowerCase();
  const list = records.filter(r => !q || [r.name, r.reason].join(' ').toLowerCase().includes(q)).slice().reverse();
  const el = document.getElementById('recordsTable');
  
  if (!list.length) {
    el.innerHTML = '<div class="empty">目前沒有歷史紀錄。在「開立勞務單」點選「存入紀錄」即會顯示於此。</div>';
    return;
  }
  
  let h = '<table><thead><tr><th>填單日期</th><th>姓名</th><th>事由</th><th class="num">應付</th><th class="num">所得稅</th><th class="num">健保</th><th class="num">實領</th><th></th></tr></thead><tbody>';
  list.forEach(r => {
    h += `<tr><td>${esc(r.fillDate || '')}</td><td><b>${esc(r.name)}</b></td><td class="muted">${esc(r.reason || '')}</td>
      <td class="num">${num(r.amount)}</td><td class="num">${num(r.tax)}</td><td class="num">${num(r.nhi)}</td><td class="num"><b>${num(r.real)}</b></td>
      <td style="text-align:right;white-space:nowrap;">
        <button class="btn ghost sm" onclick="copyRecord('${r.id}')">複製開單</button>
        <button class="btn ghost sm" onclick="reprint('${r.id}')">重印</button>
        <button class="btn ghost sm del" onclick="delRecord('${r.id}')">刪除</button></td></tr>`;
  });
  el.innerHTML = h + '</tbody></table>';
}

function num(n) {
  n = Number(n) || 0;
  return n.toLocaleString('en-US');
}

function reprint(id) {
  const r = records.find(x => x.id === id);
  if (!r) return;
  const p = people.find(x => x.id === r.personId) || { name: r.name, pid: r.pid, type: r.type };
  buildReceipt({
    p,
    amt: Number(r.amount),
    tax: Number(r.tax),
    nhi: Number(r.nhi),
    real: Number(r.real),
    fill: r.fillDate,
    end: r.endDate,
    reason: r.reason,
    income: r.income
  });
}

function copyRecord(id) {
  const r = records.find(x => x.id === id);
  if (!r) return;
  
  switchTab('issue');
  document.getElementById('isPerson').value = r.personId || "";
  fillFromPerson();
  
  document.getElementById('isReason').value = r.reason || "";
  document.getElementById('isAmount').value = r.amount || "";
  document.getElementById('isIncome').value = r.income || "9A-90";
  recalc();
}

async function delRecord(id) {
  const ok = await customConfirm('確定要永久刪除這筆歷史發放紀錄嗎？');
  if (!ok) return;
  records = records.filter(x => x.id !== id);
  save();
  renderRecords();
}

async function exportCSV() {
  if (!records.length) {
    await customAlert('目前尚無資料可供匯出！');
    return;
  }
  const cols = [
    ['fillDate', '填單日期'],
    ['endDate', '結案日期'],
    ['name', '姓名'],
    ['pid', '身份證/護照'],
    ['reason', '領款事由'],
    ['type', '身份別'],
    ['income', '所得類別'],
    ['amount', '應付總額'],
    ['tax', '代扣所得稅'],
    ['nhi', '代扣健保'],
    ['real', '實領金額']
  ];
  const head = cols.map(c => c[1]).join(',');
  const body = records.map(r => cols.map(c => csvCell(r[c[0]])).join(',')).join('\n');
  const csv = '\uFEFF' + head + '\n' + body;
  
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '勞務發放紀錄_' + new Date().toISOString().slice(0, 10) + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function csvCell(v) {
  v = (v == null ? '' : String(v));
  return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
}

/* 啟動系統預設值與渲染 */
document.getElementById('isFillDate').value = new Date().toISOString().slice(0, 10);
renderPeople();
refreshPersonSelect();
renderRecords();
</script>
