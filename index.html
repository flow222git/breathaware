<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>練息場 · 呼吸覺察</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --ink:#1a1a1a;--ink2:#555;--ink3:#999;
  --paper:#f5f3ef;--paper2:#ede9e3;--paper3:#e4dfd7;
  --accent:#2a6b5a;--accent2:#4a9b84;
  --warm:#c85d3a;--warm2:#e8845f;
  --radius:16px;--radius-sm:8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--paper);font-family:'DM Sans',sans-serif;color:var(--ink)}

nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:var(--paper);border-bottom:1px solid var(--paper3)}
.logo{font-family:'DM Serif Display',serif;font-size:17px;letter-spacing:.02em}
.logo span{color:var(--accent);font-style:italic}
.nav-tabs{display:flex;gap:2px;background:var(--paper2);border-radius:20px;padding:3px}
.nav-tab{font-size:12px;padding:5px 14px;border-radius:16px;cursor:pointer;transition:all .2s;color:var(--ink3);border:none;background:none;font-family:inherit}
.nav-tab.active{background:var(--paper);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}

.page{position:fixed;inset:56px 0 0;overflow-y:auto;display:block;visibility:hidden;opacity:0;pointer-events:none}
.page.active{visibility:visible;opacity:1;pointer-events:auto}

/* SENSE */
#page-sense{display:flex;flex-direction:column;align-items:center;padding:24px 20px 100px;gap:0}
.status-chip{display:none}
.orb-main{font-family:'DM Serif Display',serif;font-size:32px;color:rgba(255,255,255,.9);letter-spacing:.04em}
.orb-sub{font-size:20px;color:rgba(255,255,255,.6);margin-top:5px}

.orb-wrap{position:relative;width:390px;height:390px;margin-bottom:20px}
.orb{width:390px;height:390px;border-radius:50%;background:radial-gradient(circle at 38% 36%,#7db8a8,#2a6b5a);cursor:pointer;user-select:none;transition:transform .15s ease,box-shadow .3s ease;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 40px rgba(42,107,90,.18),0 2px 8px rgba(42,107,90,.1);position:relative;z-index:2}
.orb-ring{position:absolute;inset:-14px;border-radius:50%;border:1.5px solid rgba(42,107,90,.2);animation:ring-pulse 3s ease-in-out infinite}
.orb-ring2{position:absolute;inset:-30px;border-radius:50%;border:1px solid rgba(42,107,90,.1);animation:ring-pulse 3s ease-in-out infinite .6s}
@keyframes ring-pulse{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:1;transform:scale(1.03)}}
.orb-idle{text-align:center;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:10px}
.orb-idle-main{font-family:'DM Serif Display',serif;font-size:22px;color:rgba(255,255,255,.88);letter-spacing:.03em}
.orb-idle-divider{width:32px;height:1px;background:rgba(255,255,255,.3)}
.orb-active{width:90%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none}
canvas#waveform{width:100%;height:119px;display:block;border-radius:4px}
.orb-phase-row{display:flex;flex-direction:column;align-items:center;gap:4px}
.orb-phase-label{font-family:'DM Serif Display',serif;font-size:28px;color:rgba(255,255,255,.88);letter-spacing:.03em}
.orb-state-name{font-size:14px;color:rgba(255,255,255,.55);letter-spacing:.05em;min-height:0;transition:opacity .4s}
.orb-state-name:empty{display:none}
.orb.pressed{transform:scale(1.04);box-shadow:0 12px 60px rgba(42,107,90,.3),0 4px 16px rgba(42,107,90,.15)}

.live-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;width:100%;max-width:390px;margin-bottom:16px}
.stat-box{background:var(--paper2);border-radius:var(--radius-sm);padding:12px 10px;text-align:center}
.stat-val{font-family:'DM Serif Display',serif;font-size:22px;color:var(--accent)}
.stat-key{font-size:10px;color:var(--ink3);margin-top:2px;letter-spacing:.06em}

.state-desc-block{width:100%;max-width:390px;padding:16px 18px;background:var(--paper2);border-radius:var(--radius);margin-bottom:16px}
.state-desc-block .state-tag{display:inline-block;font-size:11px;padding:3px 10px;border-radius:12px;margin-bottom:8px;letter-spacing:.04em}
.state-desc-block .state-desc{font-size:13px;color:var(--ink2);line-height:1.65;margin-bottom:12px}
.state-desc-block .recommend-title{font-size:10px;color:var(--ink3);letter-spacing:.08em;margin-bottom:8px}
.state-desc-block .method-tags{display:flex;flex-wrap:wrap;gap:6px}

.session-bar{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:390px;margin-bottom:16px}
.state-tag{display:inline-block;font-size:11px;padding:3px 10px;border-radius:12px;letter-spacing:.04em}
.state-tag.calm{background:#e1f5ee;color:#085041}
.state-tag.neutral{background:#ede9e3;color:#444}
.state-tag.tense{background:#faeeda;color:#5a3200}
.state-tag.anxiety{background:#faece7;color:#5a1e0a}
.state-tag.fatigue{background:#e6f1fb;color:#0c3558}
.state-tag.deep{background:#eeedfe;color:#26215c}
.method-tag{font-size:12px;padding:4px 11px;border-radius:12px;background:var(--paper2);color:var(--ink2);border:1px solid var(--paper3)}
.timer-display{font-family:'DM Serif Display',serif;font-size:28px;color:var(--ink2)}
.stop-btn{font-size:12px;padding:8px 20px;border-radius:20px;background:var(--ink);color:var(--paper);border:none;font-family:inherit;cursor:pointer;letter-spacing:.04em;opacity:0;pointer-events:none;transition:opacity .3s}
.stop-btn.show{opacity:1;pointer-events:auto}

/* HISTORY */
#page-history{padding:24px 20px 80px}
.history-header{margin-bottom:20px}
.history-title{font-family:'DM Serif Display',serif;font-size:24px;margin-bottom:4px}
.history-sub{font-size:13px;color:var(--ink3)}

.session-card{background:var(--paper2);border-radius:var(--radius);padding:16px 18px;margin-bottom:12px;border:1px solid transparent;transition:border-color .2s}
.session-card:hover{border-color:var(--paper3)}
.sc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.sc-date{font-size:12px;color:var(--ink3)}
.sc-state{font-size:13px;font-weight:500;margin-top:2px}
.sc-metrics{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.sc-metric{font-size:12px;color:var(--ink2)}
.sc-metric span{font-weight:500;color:var(--ink)}
.mini-wave{width:100%;height:36px;display:block}
.sc-feeling{font-size:12px;color:var(--ink3);margin-top:8px;font-style:italic}

/* TRAJECTORY ANALYSIS */
.traj-box{background:var(--paper);border:1px solid var(--paper3);border-radius:var(--radius);padding:16px 18px;margin-top:12px}
.traj-title{font-size:10px;color:var(--ink3);letter-spacing:.08em;margin-bottom:12px}
.traj-phases{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.traj-phase{background:var(--paper2);border-radius:var(--radius-sm);padding:10px 8px;text-align:center}
.traj-phase-label{font-size:9px;color:var(--ink3);letter-spacing:.06em;margin-bottom:4px}
.traj-phase-bpm{font-family:'DM Serif Display',serif;font-size:18px;color:var(--accent)}
.traj-phase-ie{font-size:10px;color:var(--ink3);margin-top:2px}
.traj-arrow{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:12px}
.traj-arrow-line{flex:1;height:1px;background:var(--paper3)}
.traj-arrow-label{font-size:11px;color:var(--ink2);white-space:nowrap}
.traj-arrow-dir{font-size:14px}
.traj-findings{border-top:1px solid var(--paper3);padding-top:12px}
.traj-finding{display:flex;gap:10px;margin-bottom:8px;align-items:flex-start}
.traj-finding:last-child{margin-bottom:0}
.traj-icon{font-size:13px;margin-top:1px;flex-shrink:0}
.traj-text{font-size:13px;color:var(--ink2);line-height:1.55}
.traj-text strong{color:var(--ink);font-weight:500}

/* COMPARE */
.compare-section{margin-bottom:20px}
.compare-title{font-size:14px;font-weight:500;margin-bottom:12px}
canvas#compareChart{width:100%;height:140px;display:block;border-radius:var(--radius-sm);background:var(--paper2)}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(26,26,26,.5);z-index:200;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
.modal-overlay.open{opacity:1;pointer-events:auto}
.modal-sheet{background:var(--paper);border-radius:24px 24px 0 0;padding:28px 24px 40px;width:100%;max-width:480px;transform:translateY(40px);transition:transform .35s ease}
.modal-overlay.open .modal-sheet{transform:none}
.modal-title{font-family:'DM Serif Display',serif;font-size:22px;margin-bottom:6px}
.modal-sub{font-size:13px;color:var(--ink3);margin-bottom:20px}
.feeling-options{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.feeling-opt{font-size:13px;padding:8px 16px;border-radius:20px;border:1.5px solid var(--paper3);background:var(--paper2);cursor:pointer;transition:all .15s;user-select:none}
.feeling-opt.selected{border-color:var(--accent);background:#e1f5ee;color:var(--accent)}
.feeling-note{width:100%;border:1px solid var(--paper3);border-radius:var(--radius-sm);background:var(--paper2);padding:12px;font-family:inherit;font-size:13px;color:var(--ink);resize:none;outline:none;margin-bottom:16px}
.save-btn{width:100%;padding:14px;border-radius:var(--radius);background:var(--accent);color:#fff;border:none;font-family:inherit;font-size:15px;cursor:pointer;letter-spacing:.02em}

.empty-state{text-align:center;padding:60px 20px;color:var(--ink3)}
.empty-icon{font-size:40px;margin-bottom:12px;opacity:.4}
</style>
</head>
<body>

<nav>
  <div class="logo">練息場 <span>Breathe</span></div>
  <div class="nav-tabs">
    <button class="nav-tab active" onclick="showPage('sense')">覺察</button>
    <button class="nav-tab" onclick="showPage('history')">記錄</button>
  </div>
</nav>

<div id="page-sense" class="page active">
  <div class="status-chip" id="statusChip"></div>

  <!-- 圓圈在最上方 -->
  <div class="orb-wrap">
    <div class="orb-ring"></div><div class="orb-ring2"></div>
    <div class="orb" id="orb"
      onmousedown="startInhale()" onmouseup="startExhale()"
      ontouchstart="ev(event);startInhale()" ontouchend="ev(event);startExhale()">
      <!-- 初始說明 -->
      <div class="orb-idle" id="orbIdle">
        <div class="orb-idle-main">吸氣時按住</div>
        <div class="orb-idle-divider"></div>
        <div class="orb-idle-main">吐氣時放開</div>
      </div>
      <!-- 練習中：波形置中 + 相位文字 + 狀態標題（有值才顯示）-->
      <div class="orb-active" id="orbActive" style="display:none">
        <canvas id="waveform"></canvas>
        <div class="orb-phase-row">
          <div class="orb-phase-label" id="orbMain">吸氣中</div>
          <div class="orb-state-name" id="orbStateName"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 計時 + 結束 -->
  <div class="session-bar">
    <div class="timer-display" id="timerDisplay">0:00</div>
    <button class="stop-btn" id="stopBtn" onclick="endSession()">結束練習</button>
  </div>

  <!-- 狀態說明（圓圈下方）-->
  <div class="state-desc-block" id="stateDescBlock" style="display:none">
    <div class="state-tag" id="stateTag">—</div>
    <div class="state-desc" id="stateDesc">—</div>
    <div class="recommend-title">建議呼吸法</div>
    <div class="method-tags" id="methodTags"></div>
  </div>

  <!-- 數據在最下方 -->
  <div class="live-stats">
    <div class="stat-box"><div class="stat-val" id="statBPM">—</div><div class="stat-key">BPM</div></div>
    <div class="stat-box"><div class="stat-val" id="statIE">—</div><div class="stat-key">吸：吐</div></div>
    <div class="stat-box"><div class="stat-val" id="statCount">0</div><div class="stat-key">呼吸次數</div></div>
  </div>
</div>

<div id="page-history" class="page">
  <div class="history-header">
    <div class="history-title">練習記錄</div>
    <div class="history-sub" id="histSub">載入中…</div>
  </div>
  <div class="compare-section" id="compareSection" style="display:none">
    <div class="compare-title">BPM 趨勢（近 10 次）</div>
    <canvas id="compareChart"></canvas>
  </div>
  <div id="sessionList"></div>
</div>

<div class="modal-overlay" id="feelingModal">
  <div class="modal-sheet">
    <div class="modal-title">練習結束了</div>
    <div class="modal-sub">說說你現在的感受？</div>
    <div class="feeling-options" id="feelingOptions">
      <div class="feeling-opt" onclick="toggleFeeling(this)">輕鬆很多</div>
      <div class="feeling-opt" onclick="toggleFeeling(this)">稍微放鬆</div>
      <div class="feeling-opt" onclick="toggleFeeling(this)">沒什麼變化</div>
      <div class="feeling-opt" onclick="toggleFeeling(this)">還是緊繃</div>
      <div class="feeling-opt" onclick="toggleFeeling(this)">有點疲倦</div>
      <div class="feeling-opt" onclick="toggleFeeling(this)">更清醒了</div>
      <div class="feeling-opt" onclick="toggleFeeling(this)">心跳變慢</div>
      <div class="feeling-opt" onclick="toggleFeeling(this)">頭腦清晰</div>
    </div>
    <textarea class="feeling-note" id="feelingNote" rows="3" placeholder="還有什麼想記錄的？（選填）"></textarea>
    <button class="save-btn" onclick="saveSession()">儲存這次練習</button>
  </div>
</div>

<script>
// ── UTILS ──
function ev(e){e.preventDefault()}

// ── STATE DEFS ──
const STATES={
  deep:{label:'深度放鬆',cls:'deep',desc:'呼吸非常緩慢而穩定，副交感神經非常活躍——身體正在修復與沉澱。你已經在一個很好的地方了。',methods:['維持當前節奏','延伸練習：4-7-8 法','記錄此刻感受']},
  calm:{label:'平靜放鬆',cls:'calm',desc:'呼吸落在共振呼吸區間，吐氣略長於吸氣，副交感活性良好。這是練習最容易維持的良好狀態。',methods:['共振呼吸（6 BPM）','延長吐氣法','維持練習']},
  neutral:{label:'平衡中性',cls:'neutral',desc:'呼吸頻率與吸吐比均在正常靜息範圍，身心大致平衡，適合開始引導練習。',methods:['Box Breathing（4:4:4:4）','共振呼吸引導','自由選擇練習']},
  tense:{label:'輕度緊繃',cls:'tense',desc:'呼吸頻率偏快，交感神經活性上升。也許剛結束忙碌，或心裡有些事還沒放下。試著把吐氣慢慢拉長。',methods:['4-7-8 呼吸法','延長吐氣（1:2 比例）','先穩定節律再降頻率']},
  anxiety:{label:'明顯過亢',cls:'anxiety',desc:'呼吸頻率快且吸氣比例偏重，交感神經顯著激活。不用急著改變——先從一口長長的吐氣開始。',methods:['Cyclic Sighing（雙吸一長吐）','4-7-8（緩進）','先吐一口長氣再開始']},
  fatigue:{label:'疲勞耗竭',cls:'fatigue',desc:'呼吸頻率偏快但節律不穩定，可能是身體疲勞時的代償反應。讓每次呼吸的長度變得一致就好。',methods:['Box Breathing（穩定節律）','等長呼吸 4:4:4:4','避免過度深呼吸']}
};

function classify(bpm,ie,stability){
  if(bpm<=9&&stability>=40)return'deep';
  if(bpm>=24&&ie>=1.3)return'anxiety';
  if(bpm>=18&&ie<1.0&&stability<50)return'fatigue';
  if(bpm>=18)return'tense';
  if(bpm>=6&&bpm<=14&&ie<=1.15&&stability>=50)return'calm';
  if(bpm>14&&bpm<18&&ie>=0.8&&ie<=1.2)return'neutral';
  if(bpm<=9)return'deep';
  return'neutral';
}

// ── TRAJECTORY ANALYSIS ENGINE ──
function analyzeTrajectory(breaths){
  if(breaths.length<4) return null;

  const n=breaths.length;
  const third=Math.floor(n/3);

  // split into thirds
  const early=breaths.slice(0,third);
  const mid=breaths.slice(third,third*2);
  const late=breaths.slice(third*2);

  function phaseStats(arr){
    const cycles=arr.map(b=>b.inhaleMs+b.exhaleMs);
    const avgCycle=cycles.reduce((a,b)=>a+b,0)/cycles.length;
    const bpm=Math.round(60000/avgCycle*10)/10;
    const avgI=arr.reduce((s,b)=>s+b.inhaleMs,0)/arr.length;
    const avgE=arr.reduce((s,b)=>s+b.exhaleMs,0)/arr.length;
    const ie=Math.round(avgI/avgE*100)/100;
    // coefficient of variation of cycle lengths
    const mean=cycles.reduce((a,b)=>a+b,0)/cycles.length;
    const cv=Math.sqrt(cycles.reduce((s,c)=>s+Math.pow(c-mean,2),0)/cycles.length)/mean;
    // avg inhale duration in seconds
    const avgInhaleS=Math.round(avgI/100)/10;
    const avgExhaleS=Math.round(avgE/100)/10;
    return{bpm,ie,cv,avgInhaleS,avgExhaleS,stability:Math.max(0,Math.min(100,Math.round((1-cv)*100)))};
  }

  const e=phaseStats(early);
  const m=phaseStats(mid);
  const l=phaseStats(late);

  // per-breath data for detailed analysis
  const allCycles=breaths.map(b=>b.inhaleMs+b.exhaleMs);
  const allBPMs=allCycles.map(c=>Math.round(60000/c*10)/10);
  const allIEs=breaths.map(b=>Math.round(b.inhaleMs/b.exhaleMs*100)/100);

  const globalCV=phaseStats(breaths).cv;

  // ── FINDING RULES ──
  const findings=[];

  // 1. BPM trend: early vs late
  const bpmDrop=e.bpm-l.bpm;
  const bpmRise=l.bpm-e.bpm;
  if(bpmDrop>=3){
    findings.push({
      icon:'↘',
      text:`你的呼吸頻率從開始的 <strong>${e.bpm} BPM</strong> 下降到後段的 <strong>${l.bpm} BPM</strong>，減少了 ${bpmDrop.toFixed(1)} 次／分——這是自律神經開始調節的清楚訊號。`
    });
  } else if(bpmRise>=3){
    findings.push({
      icon:'↗',
      text:`呼吸頻率從 <strong>${e.bpm} BPM</strong> 上升到 <strong>${l.bpm} BPM</strong>，練習後段反而加快了。可能是專注力分散，或身體正在適應新的節奏。`
    });
  } else {
    findings.push({
      icon:'→',
      text:`整體呼吸頻率相當穩定，前段 <strong>${e.bpm} BPM</strong>、後段 <strong>${l.bpm} BPM</strong>，變化幅度在 3 次以內。`
    });
  }

  // 2. Stability trend
  const stabChange=l.stability-e.stability;
  if(stabChange>=15){
    findings.push({
      icon:'◎',
      text:`節律穩定度明顯提升：前段 ${e.stability}%，後段 ${l.stability}%。你的呼吸在練習過程中越來越有規律。`
    });
  } else if(stabChange<=-15){
    findings.push({
      icon:'◌',
      text:`節律在後段出現較大波動（前段 ${e.stability}%，後段 ${l.stability}%）。這可能是注意力轉移，或呼吸肌開始疲勞的訊號。`
    });
  } else if(globalCV>0.3){
    findings.push({
      icon:'〜',
      text:`整體節律變異較大（穩定度 ${Math.round((1-globalCV)*100)}%），每次呼吸的長度起伏明顯。這很常見——呼吸本來就不是機器，覺察本身就是練習。`
    });
  }

  // 3. I:E ratio shift
  const ieDrop=e.ie-l.ie;
  const ieRise=l.ie-e.ie;
  if(ieDrop>=0.2){
    findings.push({
      icon:'☽',
      text:`吐氣比例逐漸增加：吸吐比從前段 ${e.ie} 改善到後段 ${l.ie}。延長的吐氣正在幫助副交感神經活化。`
    });
  } else if(ieRise>=0.2){
    findings.push({
      icon:'☀',
      text:`吸氣比例在後段偏重（吸吐比 ${l.ie}），這可能反映輕度的喚醒或緊張感。下次可以試著有意識地把吐氣拉得比吸氣長一些。`
    });
  }

  // 4. Depth variation (inhale variance)
  const inhales=breaths.map(b=>b.inhaleMs);
  const inhMean=inhales.reduce((a,b)=>a+b,0)/inhales.length;
  const inhCV=Math.sqrt(inhales.reduce((s,c)=>s+Math.pow(c-inhMean,2),0)/inhales.length)/inhMean;
  if(inhCV>0.35){
    const maxI=Math.max(...inhales)/1000;
    const minI=Math.min(...inhales)/1000;
    findings.push({
      icon:'↕',
      text:`吸氣深淺變化明顯，最長達 ${maxI.toFixed(1)} 秒、最短只有 ${minI.toFixed(1)} 秒，落差 ${(maxI-minI).toFixed(1)} 秒。這可能是在摸索舒適深度，也可能是專注力偶爾分散。`
    });
  }

  // 5. Mid-session dip/peak
  if(n>=9){
    const midBPM=m.bpm;
    if(midBPM<e.bpm-2&&midBPM<l.bpm-2){
      findings.push({
        icon:'⌢',
        text:`中段呼吸最慢（${midBPM} BPM），前後段都較快。有時候是身體在中間短暫進入很深的狀態，然後注意力稍微拉回。`
      });
    } else if(midBPM>e.bpm+2&&midBPM>l.bpm+2){
      findings.push({
        icon:'⌣',
        text:`中段呼吸出現短暫加速（${midBPM} BPM），前後段都較平穩。可能有一個外部干擾，或是身體在重新調整節奏。`
      });
    }
  }

  // 6. Summary sentence
  const overallBpm=phaseStats(breaths).bpm;
  const overallIE=phaseStats(breaths).ie;
  const overallStab=phaseStats(breaths).stability;
  const stateKey=classify(overallBpm,overallIE,overallStab);
  const stateName=STATES[stateKey].label;

  return{early:e,mid:m,late:l,findings,stateKey,overallBpm,overallIE,overallStab};
}

// ── SESSION STATE ──
// 呼吸計時邏輯：
//   吸氣 = pressStart → release（放開）
//   吐氣 = release → 下一次 pressStart
// 所以完整一次呼吸在「下一次按下」時才存入 breaths[]
let pressing=false,pressStart=0,exhaleStart=0;
let breaths=[],wavePoints=[];
let sessionActive=false,sessionStart=0;
let timerInterval=null,currentPhase='idle';
let pendingInhaleMs=0; // 等待吐氣完成的吸氣時長

// ── ORB COLOR ENGINE ──
// 吸氣：綠色系，隨時間從淺綠→深綠（越深越充滿）
// 吐氣：藍色系，隨時間從深藍→淺藍（越淺越釋放）
let orbColorRAF = null;
let orbPhaseStart = 0;

const INHALE_COLORS = [
  // [inner, outer] at t=0 (淺)
  ['#a8d5c2', '#4a9b84'],
  // at max (深，約 8s)
  ['#2a6b5a', '#0d3d2e'],
];
const EXHALE_COLORS = [
  // [inner, outer] at t=0 (深藍)
  ['#5b8fa8', '#2d5f8a'],
  // at max release (淺藍灰)
  ['#b8d4e6', '#7aafc9'],
];

function lerpColor(a, b, t) {
  // a, b = '#rrggbb', t = 0..1
  const ah = parseInt(a.slice(1), 16);
  const bh = parseInt(b.slice(1), 16);
  const ar = (ah >> 16) & 0xff, ag = (ah >> 8) & 0xff, ab = ah & 0xff;
  const br = (bh >> 16) & 0xff, bg = (bh >> 8) & 0xff, bb = bh & 0xff;
  const rr = Math.round(ar + (br - ar) * t);
  const rg = Math.round(ag + (bg - ag) * t);
  const rb = Math.round(ab + (bb - ab) * t);
  return '#' + [rr, rg, rb].map(v => v.toString(16).padStart(2, '0')).join('');
}

function animateOrbColor(phase) {
  cancelAnimationFrame(orbColorRAF);
  orbPhaseStart = Date.now();
  const maxMs = phase === 'inhale' ? 8000 : 10000; // saturate over 8s inhale / 10s exhale
  const orb = document.getElementById('orb');

  function frame() {
    const elapsed = Date.now() - orbPhaseStart;
    const t = Math.min(elapsed / maxMs, 1);
    const eased = 1 - Math.pow(1 - t, 2); // ease-out

    let inner, outer, shadow;
    if (phase === 'inhale') {
      inner = lerpColor(INHALE_COLORS[0][0], INHALE_COLORS[1][0], eased);
      outer = lerpColor(INHALE_COLORS[0][1], INHALE_COLORS[1][1], eased);
      shadow = `0 8px 40px rgba(42,107,90,${0.18 + eased * 0.22}), 0 2px 8px rgba(42,107,90,${0.1 + eased * 0.15})`;
    } else {
      inner = lerpColor(EXHALE_COLORS[0][0], EXHALE_COLORS[1][0], eased);
      outer = lerpColor(EXHALE_COLORS[0][1], EXHALE_COLORS[1][1], eased);
      shadow = `0 8px 40px rgba(45,95,138,${0.25 - eased * 0.12}), 0 2px 8px rgba(45,95,138,${0.12 - eased * 0.06})`;
    }

    orb.style.background = `radial-gradient(circle at 38% 36%, ${inner}, ${outer})`;
    orb.style.boxShadow = shadow;
    if (t < 1) orbColorRAF = requestAnimationFrame(frame);
  }
  frame();
}

function resetOrbColor() {
  cancelAnimationFrame(orbColorRAF);
  const orb = document.getElementById('orb');
  orb.style.background = 'radial-gradient(circle at 38% 36%, #7db8a8, #2a6b5a)';
  orb.style.boxShadow = '0 8px 40px rgba(42,107,90,.18), 0 2px 8px rgba(42,107,90,.1)';
}

function startInhale(){
  if(!sessionActive){
    sessionActive=true;sessionStart=Date.now();
    document.getElementById('stopBtn').classList.add('show');
    timerInterval=setInterval(updateTimer,1000);
    // 第一次按下：切換圓圈內容
    document.getElementById('orbIdle').style.display='none';
    document.getElementById('orbActive').style.display='flex';
    resizeWave();
  }

  // 結算上一次吐氣
  if(pendingInhaleMs>0 && currentPhase==='exhaling'){
    const exhaleMs=Date.now()-exhaleStart;
    if(exhaleMs>200){
      breaths.push({inhaleMs:pendingInhaleMs,exhaleMs,ts:Date.now()});
      updateLiveStats();
    }
    pendingInhaleMs=0;
  }

  pressing=true;pressStart=Date.now();currentPhase='inhaling';
  document.getElementById('orb').classList.add('pressed');
  document.getElementById('orbMain').textContent='吸氣中';
  const chip=document.getElementById('statusChip');
  chip.textContent='吸氣';chip.className='status-chip inhaling';
  wavePoints.push({t:Date.now()-sessionStart,phase:1});
  if(!waveRAF)drawWave();
  animateOrbColor('inhale');
  playOrgan(FREQ_G4, 280);
}

function startExhale(){
  if(!pressing)return;
  pressing=false;
  const inhaleMs=Date.now()-pressStart;
  if(inhaleMs<300){currentPhase='idle';return;}
  pendingInhaleMs=inhaleMs;
  exhaleStart=Date.now();
  currentPhase='exhaling';
  document.getElementById('orb').classList.remove('pressed');
  document.getElementById('orbMain').textContent='吐氣中';
  const chip=document.getElementById('statusChip');
  chip.textContent='吐氣';chip.className='status-chip exhaling';
  wavePoints.push({t:Date.now()-sessionStart,phase:0});
  animateOrbColor('exhale');
  playOrgan(FREQ_C4, 350);
}

function recordBreath(){} // 已廢棄，邏輯移入 startInhale

function updateLiveStats(){
  if(breaths.length===0)return;
  const recent=breaths.slice(-6);
  const avgCycle=recent.reduce((s,b)=>s+b.inhaleMs+b.exhaleMs,0)/recent.length;
  const bpm=Math.round(60000/avgCycle*10)/10;
  const avgI=recent.reduce((s,b)=>s+b.inhaleMs,0)/recent.length;
  const avgE=recent.reduce((s,b)=>s+b.exhaleMs,0)/recent.length;
  const ie=avgI/avgE;
  const cycles=recent.map(b=>b.inhaleMs+b.exhaleMs);
  const mean=cycles.reduce((a,b)=>a+b,0)/cycles.length;
  const cv=Math.sqrt(cycles.reduce((s,c)=>s+Math.pow(c-mean,2),0)/cycles.length)/mean;
  const stability=Math.max(0,Math.min(100,Math.round((1-cv)*100)));

  document.getElementById('statBPM').textContent=bpm.toFixed(1);
  document.getElementById('statIE').textContent=(avgI/1000).toFixed(1)+':'+(avgE/1000).toFixed(1);
  document.getElementById('statCount').textContent=breaths.length;

  if(breaths.length>=3){
    const key=classify(bpm,ie,stability);
    const s=STATES[key];
    // 狀態標題寫進圓圈，隱藏吸吐氣文字
    const orbStateEl=document.getElementById('orbStateName');
    const orbMainEl=document.getElementById('orbMain');
    orbStateEl.textContent=s.label;
    orbMainEl.style.display='none'; // 有狀態後不再顯示「吸氣中／吐氣中」
    // 說明區塊顯示在圓圈下方
    const block=document.getElementById('stateDescBlock');
    document.getElementById('stateTag').textContent=s.label;
    document.getElementById('stateTag').className='state-tag '+s.cls;
    document.getElementById('stateDesc').textContent=s.desc;
    document.getElementById('methodTags').innerHTML=s.methods.map(m=>`<span class="method-tag">${m}</span>`).join('');
    block.style.display='block';
  }
}

function drawWave(){
  const W=waveCanvas.width,H=waveCanvas.height;
  waveCtx.clearRect(0,0,W,H);
  if(wavePoints.length<2){waveRAF=requestAnimationFrame(drawWave);return}
  const now=Date.now()-sessionStart;
  const windowMs=20000;
  const visible=[...wavePoints,{t:now,phase:pressing?1:0}];
  const startT=Math.max(0,now-windowMs);
  waveCtx.beginPath();
  let first=true;
  for(let i=0;i<visible.length;i++){
    const p=visible[i];
    if(p.t<startT)continue;
    const x=((p.t-startT)/windowMs)*W;
    const y=p.phase===1?H*.15:H*.85;
    if(first){waveCtx.moveTo(x,y);first=false}
    else{const prev=visible[i-1];const px=((prev.t-startT)/windowMs)*W;waveCtx.lineTo(px+1,y);waveCtx.lineTo(x,y)}
  }
  const lastP=visible[visible.length-1];
  waveCtx.lineTo(W,pressing?H*.15:H*.85);
  waveCtx.strokeStyle='rgba(255,255,255,.85)';
  waveCtx.lineWidth=2*devicePixelRatio;waveCtx.lineCap='round';waveCtx.stroke();
  waveCtx.lineTo(W,H);
  const firstVis=visible.find(p=>p.t>=startT);
  waveCtx.lineTo(((firstVis?firstVis.t:startT)-startT)/windowMs*W,H);
  waveCtx.closePath();
  waveCtx.fillStyle='rgba(255,255,255,.08)';
  waveCtx.fill();
  waveCtx.fillStyle='rgba(255,255,255,.25)';
  for(let t=Math.ceil(startT/5000)*5000;t<=now;t+=5000){
    const x=((t-startT)/windowMs)*W;
    waveCtx.fillRect(x,H-3*devicePixelRatio,devicePixelRatio,3*devicePixelRatio);
  }
  waveRAF=requestAnimationFrame(drawWave);
}

function updateTimer(){
  const el=Math.floor((Date.now()-sessionStart)/1000);
  document.getElementById('timerDisplay').textContent=
    Math.floor(el/60)+':'+String(el%60).padStart(2,'0');
}

function endSession(){
  if(!sessionActive)return;
  // 結算最後一次吐氣（如果有）
  if(pendingInhaleMs>0 && currentPhase==='exhaling'){
    const exhaleMs=Date.now()-exhaleStart;
    if(exhaleMs>200) breaths.push({inhaleMs:pendingInhaleMs,exhaleMs,ts:Date.now()});
    pendingInhaleMs=0;
  }
  sessionActive=false;clearInterval(timerInterval);
  cancelAnimationFrame(waveRAF);waveRAF=null;
  document.getElementById('orb').classList.remove('pressed');
  document.getElementById('statusChip').className='status-chip';
  document.getElementById('statusChip').textContent='練習完成';
  stopOrgan(600);
  document.getElementById('feelingModal').classList.add('open');
}

function toggleFeeling(el){el.classList.toggle('selected')}

function saveSession(){
  const feelings=[...document.querySelectorAll('.feeling-opt.selected')].map(el=>el.textContent);
  const note=document.getElementById('feelingNote').value;
  if(breaths.length===0){closeModal();resetSession();return}

  const avgCycle=breaths.reduce((s,b)=>s+b.inhaleMs+b.exhaleMs,0)/breaths.length;
  const bpm=Math.round(60000/avgCycle*10)/10;
  const avgI=breaths.reduce((s,b)=>s+b.inhaleMs,0)/breaths.length;
  const avgE=breaths.reduce((s,b)=>s+b.exhaleMs,0)/breaths.length;
  const ie=avgI/avgE;
  const cycles=breaths.map(b=>b.inhaleMs+b.exhaleMs);
  const mean=cycles.reduce((a,b)=>a+b,0)/cycles.length;
  const cv=Math.sqrt(cycles.reduce((s,c)=>s+Math.pow(c-mean,2),0)/cycles.length)/mean;
  const stability=Math.max(0,Math.min(100,Math.round((1-cv)*100)));
  const stateKey=classify(bpm,ie,stability);
  const durationSec=Math.floor((Date.now()-sessionStart)/1000);
  const snap=wavePoints.filter((_,i)=>i%3===0).map(p=>({t:p.t,phase:p.phase}));
  const traj=analyzeTrajectory(breaths);

  const record={
    id:Date.now(),ts:Date.now(),durationSec,bpm,
    avgInhale:Math.round(avgI),avgExhale:Math.round(avgE),
    ie:Math.round(ie*100)/100,stability,breathCount:breaths.length,
    stateKey,feelings,note,waveSnap:snap,
    breathDetails:breaths.map(b=>({i:b.inhaleMs,e:b.exhaleMs,ts:b.ts})),
    trajectory:traj
  };

  const history=getHistory();
  history.unshift(record);
  localStorage.setItem('jte_breath_history',JSON.stringify(history.slice(0,100)));
  closeModal();resetSession();showPage('history');
}

function closeModal(){
  document.getElementById('feelingModal').classList.remove('open');

  document.getElementById('feelingNote').value='';
}

  breaths=[];wavePoints=[];pressing=false;currentPhase='idle';

// ── TRAJECTORY HTML ──

  const bpmColor=l.bpm<e.bpm-1?'#2a6b5a':l.bpm>e.bpm+1?'#c85d3a':'#555';
  const arrowLabel=l.bpm<e.bpm-1
    ?`BPM 下降 ${(e.bpm-l.bpm).toFixed(1)}`
    :l.bpm>e.bpm+1
    ?`BPM 上升 ${(l.bpm-e.bpm).toFixed(1)}`
    :'BPM 大致穩定';

  return`<div class="traj-box">
    <div class="traj-title">TRAJECTORY ANALYSIS · 呼吸軌跡分析</div>
    <div class="traj-phases">
      <div class="traj-phase">
        <div class="traj-phase-label">前段</div>
        <div class="traj-phase-bpm">${e.bpm}</div>
        <div class="traj-phase-ie">${e.avgInhaleS}s : ${e.avgExhaleS}s</div>
        <div class="traj-phase-ie">穩定 ${e.stability}%</div>
      </div>
      <div class="traj-phase">
        <div class="traj-phase-label">中段</div>
        <div class="traj-phase-bpm">${m.bpm}</div>
        <div class="traj-phase-ie">${m.avgInhaleS}s : ${m.avgExhaleS}s</div>
        <div class="traj-phase-ie">穩定 ${m.stability}%</div>
      </div>
      <div class="traj-phase">
        <div class="traj-phase-label">後段</div>
        <div class="traj-phase-bpm" style="color:${bpmColor}">${l.bpm}</div>
        <div class="traj-phase-ie">${l.avgInhaleS}s : ${l.avgExhaleS}s</div>
        <div class="traj-phase-ie">穩定 ${l.stability}%</div>
      </div>
    </div>
    <div class="traj-arrow">
      <div class="traj-arrow-line"></div>
      <div class="traj-arrow-dir" style="color:${bpmColor}">${bpmArrow}</div>
      <div class="traj-arrow-label">${arrowLabel}</div>
      <div class="traj-arrow-line"></div>

    <div class="traj-findings">
      ${findings.map(f=>`<div class="traj-finding">
        <div class="traj-icon">${f.icon}</div>

function drawMiniWave(canvas,snap){
  canvas.width=canvas.offsetWidth*devicePixelRatio;
  canvas.height=canvas.offsetHeight*devicePixelRatio;
  const ctx=canvas.getContext('2d');
  const W=canvas.width,H=canvas.height;
  if(snap.length<2)return;
  const startT=snap[0].t,endT=snap[snap.length-1].t,range=Math.max(endT-startT,1);
  ctx.beginPath();
  let first=true;
  for(let i=0;i<snap.length;i++){
    const p=snap[i];
    const x=((p.t-startT)/range)*W;
    const y=p.phase===1?H*.15:H*.85;
    if(first){ctx.moveTo(x,y);first=false}
    else{const prev=snap[i-1];ctx.lineTo(((prev.t-startT)/range)*W+1,y);ctx.lineTo(x,y)}
  }
  ctx.lineTo(W,snap[snap.length-1].phase===1?H*.15:H*.85);
  ctx.strokeStyle='#2a6b5a';ctx.lineWidth=1.5*devicePixelRatio;ctx.stroke();
}

function drawCompareChart(sessions){
  const canvas=document.getElementById('compareChart');
  canvas.width=canvas.offsetWidth*devicePixelRatio;
  canvas.height=canvas.offsetHeight*devicePixelRatio;
  const ctx=canvas.getContext('2d');
  const W=canvas.width,H=canvas.height;
  const pad={t:16,r:12,b:24,l:36};
  const gW=W-pad.l-pad.r,gH=H-pad.t-pad.b;
  if(sessions.length<2)return;
  const bpms=sessions.map(s=>s.bpm);
  const minB=Math.min(...bpms)-2,maxB=Math.max(...bpms)+2;
  ctx.strokeStyle='rgba(0,0,0,.06)';ctx.lineWidth=devicePixelRatio;
  for(let i=0;i<=4;i++){
    const y=pad.t+(gH/4)*i;
    ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(pad.l+gW,y);ctx.stroke();
    ctx.fillStyle='rgba(100,100,100,.5)';
    ctx.font=`${9*devicePixelRatio}px 'DM Sans'`;
    ctx.fillText((maxB-((maxB-minB)/4)*i).toFixed(0),0,y+3*devicePixelRatio);
  }
  ctx.beginPath();
  sessions.forEach((s,i)=>{
    const x=pad.l+(i/(sessions.length-1))*gW;
    const y=pad.t+((maxB-s.bpm)/(maxB-minB))*gH;
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  });
  ctx.strokeStyle='#2a6b5a';ctx.lineWidth=2*devicePixelRatio;ctx.lineJoin='round';ctx.stroke();
  sessions.forEach((s,i)=>{
    const x=pad.l+(i/(sessions.length-1))*gW;
    const y=pad.t+((maxB-s.bpm)/(maxB-minB))*gH;
    ctx.beginPath();ctx.arc(x,y,3*devicePixelRatio,0,Math.PI*2);
    ctx.fillStyle='#2a6b5a';ctx.fill();
    const d=new Date(s.ts);
    ctx.fillStyle='rgba(100,100,100,.6)';
    ctx.font=`${8*devicePixelRatio}px 'DM Sans'`;
    ctx.textAlign='center';
    ctx.fillText((d.getMonth()+1)+'/'+(d.getDate()),x,H-4*devicePixelRatio);
  });
}

// ── ORGAN AUDIO ENGINE ──
// G4 = 392 Hz (吸氣), C4 = 261.63 Hz (吐氣)
// 管風琴音色：基音 + 泛音列（2, 3, 4, 5, 6, 8 次諧波）加不同比例
let audioCtx = null;
let currentOrgan = null; // { oscillators, gainNode }

const ORGAN_PARTIALS = [
  // [harmonicMultiplier, relativeGain]
  [1,    0.50],  // 基音 (8')
  [2,    0.28],  // 第2泛音 (4')
  [3,    0.14],  // 第3泛音 (2⅔')
  [4,    0.10],  // 第4泛音 (2')
  [5,    0.05],  // 第5泛音 (1⅗')
  [6,    0.04],  // 第6泛音
  [8,    0.03],  // 第8泛音 (1')
];

function getAudioCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  // Resume if suspended (mobile autoplay policy)
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playOrgan(freq, fadeinMs = 300) {
  stopOrgan(80); // fade out previous

  const ctx = getAudioCtx();
  const now = ctx.currentTime;

  // master gain for this note
  const masterGain = ctx.createGain();
  masterGain.gain.setValueAtTime(0, now);
  masterGain.gain.linearRampToValueAtTime(0.18, now + fadeinMs / 1000);

  // slight tremolo (3.5 Hz, depth 3%)
  const tremoloOsc = ctx.createOscillator();
  tremoloOsc.frequency.value = 3.5;
  const tremoloGain = ctx.createGain();
  tremoloGain.gain.value = 0.03;
  tremoloOsc.connect(tremoloGain);

  // reverb via convolver (simple impulse)
  const convolver = ctx.createConvolver();
  convolver.buffer = makeImpulse(ctx, 1.8, 2.5);
  const reverbGain = ctx.createGain();
  reverbGain.gain.value = 0.35;

  const oscs = ORGAN_PARTIALS.map(([mult, gain]) => {
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = freq * mult;

    // tiny detune per partial for warmth
    osc.detune.value = (Math.random() - 0.5) * 3;

    const partialGain = ctx.createGain();
    partialGain.gain.value = gain;

    // tremolo modulates this partial
    tremoloGain.connect(partialGain.gain);

    osc.connect(partialGain);
    partialGain.connect(masterGain);
    partialGain.connect(convolver); // also send to reverb

    osc.start(now);
    return osc;
  });

  tremoloOsc.start(now);
  convolver.connect(reverbGain);
  reverbGain.connect(ctx.destination);
  masterGain.connect(ctx.destination);

  currentOrgan = { oscs, tremoloOsc, masterGain, ctx };
}

function stopOrgan(fadeMs = 400) {
  if (!currentOrgan) return;
  const { oscs, tremoloOsc, masterGain, ctx } = currentOrgan;
  const now = ctx.currentTime;
  masterGain.gain.cancelScheduledValues(now);
  masterGain.gain.setValueAtTime(masterGain.gain.value, now);
  masterGain.gain.linearRampToValueAtTime(0, now + fadeMs / 1000);
  const stopTime = now + fadeMs / 1000 + 0.05;
  oscs.forEach(o => { try { o.stop(stopTime); } catch(_){} });
  try { tremoloOsc.stop(stopTime); } catch(_){}
  currentOrgan = null;
}

// Generate a simple reverb impulse response
function makeImpulse(ctx, duration, decay) {
  const sr = ctx.sampleRate;
  const len = Math.floor(sr * duration);
  const buf = ctx.createBuffer(2, len, sr);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    for (let i = 0; i < len; i++) {
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
  }
  return buf;
}
