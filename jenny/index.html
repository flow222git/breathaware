<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>勞務報酬系統</title>
<style>
  :root{--ink:#1c2330;--ink-soft:#55607a;--line:#dfe3ea;--line-soft:#eef0f5;--bg:#f5f6f9;
    --card:#fff;--accent:#2f6df0;--accent-soft:#eaf1ff;--danger:#d8453a;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    color:var(--ink);background:var(--bg);font-size:15px;line-height:1.55;}
  button{font-family:inherit;cursor:pointer;} input,select,textarea{font-family:inherit;font-size:14px;}
  .app{max-width:1080px;margin:0 auto;padding:0 20px 80px;}
  header.bar{display:flex;align-items:center;gap:14px;padding:20px 0 16px;}
  .logo{display:flex;gap:3px;} .logo span{width:11px;height:11px;border-radius:2px;display:block;}
  .logo .a{background:#e8453c;}.logo .b{background:#34a853;}.logo .c{background:#2f6df0;}.logo .d{background:#f6b21a;}
  header.bar h1{font-size:19px;margin:0;font-weight:700;} header.bar small{color:var(--ink-soft);font-weight:400;margin-left:2px;}
  .tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:22px;}
  .tabs button{background:none;border:none;padding:10px 4px;margin-right:18px;font-size:15px;color:var(--ink-soft);border-bottom:2px solid transparent;font-weight:600;}
  .tabs button.on{color:var(--ink);border-bottom-color:var(--accent);}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;}
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
  .toolbar input.search{flex:1;min-width:180px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;}
  .btn{padding:9px 15px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:600;font-size:14px;}
  .btn:hover{border-color:#c3cad6;} .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn.primary:hover{background:#255cd6;} .btn.ghost{background:none;border-color:transparent;color:var(--accent);padding:6px 8px;}
  .btn.sm{padding:5px 10px;font-size:13px;} .btn.del{color:var(--danger);}
  table{width:100%;border-collapse:collapse;}
  th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line-soft);font-size:14px;}
  th{color:var(--ink-soft);font-weight:600;font-size:12.5px;} tr:hover td{background:#fafbfd;}
  .tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:600;}
  .tag.local{background:#eaf6ef;color:#1f7a52;} .tag.foreign{background:#fdeee9;color:#b4503f;}
  .muted{color:var(--ink-soft);} .num{font-variant-numeric:tabular-nums;text-align:right;}
  .empty{text-align:center;color:var(--ink-soft);padding:46px 10px;}
  .mask{position:fixed;inset:0;background:rgba(20,26,40,.45);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto;}
  .mask.show{display:flex;} .modal{background:#fff;border-radius:14px;width:100%;max-width:680px;padding:24px;}
  .modal h2{margin:0 0 18px;font-size:18px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .fld{display:flex;flex-direction:column;gap:5px;} .fld.full{grid-column:1/-1;}
  .fld label{font-size:12.5px;color:var(--ink-soft);font-weight:600;}
  .fld input,.fld select,.fld textarea{padding:9px 11px;border:1px solid var(--line);border-radius:8px;}
  .fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;}
  .issue-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;}
  @media(max-width:820px){.issue-grid,.grid2{grid-template-columns:1fr;}}
  .calc{background:#fafbfd;border:1px solid var(--line-soft);border-radius:10px;padding:16px;}
  .calc h3{margin:0 0 10px;font-size:14px;color:var(--ink-soft);}
  .calc .line{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);}
  .calc .line:last-child{border-bottom:none;}
  .calc .line.total{font-weight:700;font-size:18px;border-top:2px solid var(--ink);margin-top:6px;padding-top:10px;}
  .calc .deduct .v{color:var(--danger);} .hint{font-size:12.5px;color:var(--ink-soft);margin-top:8px;}
  .cap{font-size:13px;color:var(--accent);margin-top:4px;}
  #receiptWrap{display:none;}
  .receipt{width:1040px;background:#fff;color:#000;border:1.5px solid #000;font-size:12px;line-height:1.4;margin:0 auto;}
  .receipt .rhead{display:grid;grid-template-columns:230px 1fr 130px;align-items:center;border-bottom:1.5px solid #000;}
  .receipt .rhead .lg{padding:10px 12px;} .receipt .rhead .lg .blocks{display:flex;gap:3px;margin-bottom:4px;}
  .receipt .rhead .lg .blocks i{width:14px;height:14px;display:block;border-radius:2px;}
  .receipt .rhead .lg small{font-size:9px;color:#333;display:block;}
  .receipt .rhead .ttl{text-align:center;font-size:24px;font-weight:800;letter-spacing:4px;}
  .receipt .rhead .dt{text-align:right;padding:10px 12px;font-size:11px;}
  .rtable{width:100%;border-collapse:collapse;} .rtable td{border:1px solid #000;padding:7px 9px;height:34px;}
  .rtable td.lbl{background:#f2f2f2;font-weight:700;width:92px;white-space:nowrap;text-align:center;}
  .line-field{border:1px solid #000;border-top:none;padding:9px 12px;}
  .line-field b{display:inline-block;min-width:78px;} .line-field .u{border-bottom:1px solid #000;padding:0 6px;}
  .mid{display:grid;grid-template-columns:1fr 1.15fr;border:1px solid #000;border-top:none;}
  .mid .left{border-right:1px solid #000;padding:14px 12px;}
  .mid .left .pay .u{border-bottom:1px solid #000;padding:2px 6px;display:inline-block;min-width:200px;font-size:15px;font-weight:700;}
  .mid .left .real{margin-top:18px;} .mid .left .real .boxline{font-size:15px;font-weight:700;margin-top:4px;}
  .mid .right{display:grid;grid-template-columns:1fr 1fr;} .mid .right .col{padding:11px 12px;}
  .mid .right .col:first-child{border-right:1px solid #000;}
  .mid .right .col .ck{font-weight:700;font-size:13px;margin-bottom:8px;}
  .mid .right .col .ded{margin:6px 0 2px;} .mid .right .col .ded .u{border-bottom:1px solid #000;padding:0 6px;display:inline-block;min-width:96px;font-weight:700;}
  .mid .right .col .note{color:#d11;font-size:10px;line-height:1.35;margin-bottom:8px;}
  .box{display:inline-block;width:13px;height:13px;border:1.3px solid #000;vertical-align:-2px;margin-right:4px;text-align:center;line-height:11px;font-weight:800;}
  .box.on::after{content:"✓";font-size:11px;}
  .rfoot{display:grid;grid-template-columns:1fr 230px;border:1px solid #000;border-top:none;}
  .rfoot .notes{padding:9px 11px;font-size:10.5px;line-height:1.6;border-right:1px solid #000;}
  .rfoot .notes .inc{margin-top:5px;} .rfoot .sign{padding:9px 11px;} .rfoot .sign .who{font-weight:700;margin-bottom:6px;}
  .rver{text-align:right;font-size:9px;color:#444;padding:3px 4px 0;}
  .receipt-actions{display:flex;gap:10px;justify-content:flex-end;margin:0 auto 16px;max-width:1040px;}
  @media print{body{background:#fff;}.app,.mask{display:none!important;}#receiptWrap{display:block!important;}
    .receipt-actions{display:none!important;}.receipt{width:100%;}@page{size:A4 landscape;margin:8mm;}}

  /* ===== 首頁 hero ===== */
  .hero{position:relative;border-radius:18px;overflow:hidden;min-height:460px;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#fff4ef 0%,#fdeef5 45%,#eef6f6 100%);
    border:1px solid var(--line);}
  .hero-bg{position:absolute;inset:0;overflow:hidden;}
  .hero-bg .glow{position:absolute;border-radius:50%;filter:blur(48px);opacity:.55;}
  .hero-bg .g1{width:340px;height:340px;background:#f8744a;top:-90px;left:-60px;}
  .hero-bg .g2{width:300px;height:300px;background:#e63b86;bottom:-80px;left:30%;}
  .hero-bg .g3{width:320px;height:320px;background:#2ba8a0;top:-60px;right:-70px;}
  .hero-bg .confetti{position:absolute;width:12px;height:12px;border-radius:3px;opacity:.85;animation:floaty 6s ease-in-out infinite;}
  .hero-bg .c1{background:#f8744a;top:18%;left:14%;animation-delay:0s;transform:rotate(20deg);}
  .hero-bg .c2{background:#e63b86;top:30%;left:80%;width:9px;height:9px;animation-delay:.6s;}
  .hero-bg .c3{background:#2ba8a0;top:66%;left:20%;animation-delay:1.1s;transform:rotate(40deg);}
  .hero-bg .c4{background:#1e6fa8;top:72%;left:74%;width:10px;height:10px;animation-delay:1.6s;}
  .hero-bg .c5{background:#f6b21a;top:12%;left:55%;width:8px;height:8px;animation-delay:.3s;}
  .hero-bg .c6{background:#e63b86;top:50%;left:8%;width:7px;height:7px;animation-delay:2s;}
  .hero-bg .c7{background:#2ba8a0;top:22%;left:40%;width:7px;height:7px;animation-delay:1.3s;}
  .hero-bg .c8{background:#f8744a;top:60%;left:90%;width:9px;height:9px;animation-delay:.9s;}
  @keyframes floaty{0%,100%{transform:translateY(0) rotate(0);}50%{transform:translateY(-14px) rotate(15deg);}}
  .hero-inner{position:relative;text-align:center;padding:40px 20px;z-index:1;}
  .hero-logo{height:64px;width:auto;margin-bottom:14px;filter:drop-shadow(0 4px 14px rgba(0,0,0,.08));}
  .hero-star{font-size:30px;color:#f6b21a;margin-bottom:2px;animation:pop 2.4s ease-in-out infinite;}
  @keyframes pop{0%,100%{transform:scale(1);}50%{transform:scale(1.25);}}
  .hero-title{font-size:40px;font-weight:800;margin:6px 0 4px;letter-spacing:1px;
    background:linear-gradient(90deg,#f8744a,#e63b86 55%,#1e6fa8);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .hero-names{margin:2px 0 10px;font-size:15px;font-weight:700;letter-spacing:1px;color:#e63b86;}
  .hero-sub{color:var(--ink-soft);margin:0 0 22px;font-size:15px;letter-spacing:2px;}
  .hero-btn{font-size:16px;padding:12px 28px;border-radius:30px;box-shadow:0 6px 18px rgba(47,109,240,.28);}
  @media(max-width:600px){.hero-title{font-size:30px;}}

  /* ===== 首頁 COER 應援 ===== */
  .coer-badge{display:inline-block;background:rgba(230,59,134,.1);color:#e63b86;font-weight:700;
    font-size:12px;letter-spacing:1px;padding:5px 12px;border-radius:20px;margin-bottom:16px;}
  .crew{display:flex;gap:14px;justify-content:center;align-items:flex-end;margin:6px 0 16px;flex-wrap:wrap;}
  .member{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;opacity:.55;transition:opacity .2s,transform .2s;}
  .member.active{opacity:1;animation:bounce 1.4s ease-in-out infinite;}
  @keyframes bounce{0%,100%{transform:translateY(-4px) scale(1.12);}50%{transform:translateY(-13px) scale(1.12);}}
  .member .topper{font-size:18px;line-height:1;}
  .member svg{width:60px;height:66px;}
  .member .mname{font-size:12px;font-weight:700;color:var(--ink);}
  .member.active .mname{color:#e63b86;}
  .member .bubble{position:absolute;top:-30px;left:50%;transform:translateX(-50%);white-space:nowrap;
    background:#fff;border:1.5px solid #e63b86;color:#e63b86;font-weight:700;font-size:12px;padding:4px 10px;border-radius:14px;box-shadow:0 3px 10px rgba(0,0,0,.1);}
  .member .bubble::after{content:"";position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:#e63b86;}
  .cheer-by{margin:2px 0 6px;font-size:14px;color:var(--ink-soft);} .cheer-by b{color:#e63b86;}
  .hero-phrase{margin:0 0 18px;font-size:14px;color:var(--ink);font-weight:600;min-height:20px;}
  .hero-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  .hero-btn.alt{background:#fff;color:#e63b86;border-color:#f3c2d8;}
  .hero-btn.alt:hover{border-color:#e63b86;}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <img src="" id="brandLogo" alt="創意思境" style="height:34px;width:auto;">
    <h1>勞務報酬系統 <small>人員建檔 · 代扣試算 · 收據列印（單機版）</small></h1>
  </header>
  <div class="tabs">
    <button id="tabHome" class="on" onclick="switchTab('home')">首頁</button>
    <button id="tabPeople" onclick="switchTab('people')">人員管理</button>
    <button id="tabIssue" onclick="switchTab('issue')">開立勞務單</button>
    <button id="tabRecords" onclick="switchTab('records')">開單紀錄</button>
  </div>

  <section id="viewHome">
    <div class="hero">
      <div class="hero-bg">
        <span class="glow g1"></span><span class="glow g2"></span><span class="glow g3"></span>
        <span class="confetti c1"></span><span class="confetti c2"></span><span class="confetti c3"></span>
        <span class="confetti c4"></span><span class="confetti c5"></span><span class="confetti c6"></span>
        <span class="confetti c7"></span><span class="confetti c8"></span>
      </div>
      <div class="hero-inner">
        <img src="" id="heroLogo" alt="創意思境" class="hero-logo">
        <div class="coer-badge">COER · 越界上色 Color Outside the Lines</div>
        <div id="heroCrew" class="crew"></div>
        <h2 class="hero-title">珍妮你好棒，加油～</h2>
        <p class="cheer-by">今天為你加油的是 ▸ <b id="cheerName">Martin</b></p>
        <p class="hero-phrase" id="heroPhrase"></p>
        <p class="hero-sub">創意思境 · 勞務報酬系統</p>
        <div class="hero-actions">
          <button class="btn hero-btn alt" onclick="renderHero()">換一個人幫我加油 ♺</button>
          <button class="btn primary hero-btn" onclick="switchTab('people')">進入系統 →</button>
        </div>
      </div>
    </div>
  </section>
  <section id="viewPeople" style="display:none;">
    <div class="card">
      <div class="toolbar">
        <input class="search" id="search" placeholder="搜尋姓名 / 身份證 / 工作卡號…" oninput="renderPeople()">
        <button class="btn primary" onclick="openForm()">＋ 新增人員</button>
      </div>
      <div id="peopleTable"></div>
    </div>
  </section>

  <section id="viewIssue" style="display:none;">
    <div class="card">
      <div class="issue-grid">
        <div>
          <div class="fld" style="margin-bottom:14px;"><label>選擇人員</label>
            <select id="isPerson" onchange="fillFromPerson()"></select></div>
          <div class="grid2">
            <div class="fld"><label>填單日期</label><input type="date" id="isFillDate"></div>
            <div class="fld"><label>工作結案日期</label><input type="date" id="isEndDate"></div>
            <div class="fld full"><label>領款事由 / 工作內容</label><textarea id="isReason" rows="2"></textarea></div>
            <div class="fld"><label>應付總金額 NT$</label><input type="number" id="isAmount" oninput="recalc()" placeholder="35000"></div>
            <div class="fld"><label>所得類別</label><select id="isIncome">
              <option value="9A-90">執行業務-其他 (9A-90)</option>
              <option value="9A-70">執行業務-表演 (9A-70)</option>
              <option value="9B">稿費 (9B)</option></select></div>
          </div>
          <div class="hint" id="personMeta"></div>
        </div>
        <div>
          <div class="calc">
            <h3>代扣試算（依身份別自動計算）</h3>
            <div class="line"><span>應付總金額</span><span class="v" id="cAmount">—</span></div>
            <div class="line deduct"><span id="cTaxLbl">代扣所得稅</span><span class="v" id="cTax">—</span></div>
            <div class="line deduct"><span>代扣二代健保 2.11%</span><span class="v" id="cNhi">—</span></div>
            <div class="line total"><span>實領金額</span><span class="v" id="cReal">—</span></div>
            <div class="cap" id="cCap"></div>
          </div>
          <div style="margin-top:16px;display:flex;gap:10px;">
            <button class="btn primary" onclick="generate()">產生收據</button>
            <button class="btn" onclick="storeRecord()">存入紀錄</button>
          </div>
          <div class="hint">稅額四捨五入到元；本國加入工會並附證明者免扣健保。「存入紀錄」會存進「開單紀錄」分頁。</div>
        </div>
      </div>
    </div>
  </section>

  <section id="viewRecords" style="display:none;">
    <div class="card">
      <div class="toolbar">
        <input class="search" id="rSearch" placeholder="搜尋姓名 / 事由…" oninput="renderRecords()">
        <button class="btn" onclick="exportCSV()">匯出 CSV</button>
      </div>
      <div id="recordsTable"></div>
    </div>
  </section>
</div>

<div class="mask" id="formMask"><div class="modal">
  <h2 id="formTitle">新增人員</h2><input type="hidden" id="fId">
  <div class="grid2">
    <div class="fld"><label>中文姓名 *</label><input id="fName"></div>
    <div class="fld"><label>英文名字</label><input id="fEn"></div>
    <div class="fld"><label>身份證 / 護照字號 *</label><input id="fId2"></div>
    <div class="fld"><label>工作卡號</label><input id="fCard"></div>
    <div class="fld"><label>手機 / 電話</label><input id="fPhone"></div>
    <div class="fld"><label>E-mail</label><input id="fEmail"></div>
    <div class="fld full"><label>戶籍地址</label><input id="fAddr"></div>
    <div class="fld"><label>身份別</label><select id="fType"><option>本國人士</option><option>外籍人士</option></select></div>
    <div class="fld"><label>所得類別（預設）</label><select id="fIncome">
      <option value="9A-90">執行業務-其他 (9A-90)</option><option value="9A-70">執行業務-表演 (9A-70)</option><option value="9B">稿費 (9B)</option></select></div>
    <div class="fld"><label>是否加入工會</label><select id="fUnion"><option>否</option><option>是</option></select></div>
    <div class="fld"><label>是否投保健保</label><select id="fNhi"><option>是</option><option>否</option></select></div>
    <div class="fld"><label>銀行名稱</label><input id="fBank"></div>
    <div class="fld"><label>分行名稱</label><input id="fBranch"></div>
    <div class="fld full"><label>銀行帳號</label><input id="fAcct"></div>
  </div>
  <div class="modal-actions"><button class="btn" onclick="closeForm()">取消</button>
    <button class="btn primary" onclick="savePerson()">儲存</button></div>
</div></div>

<div id="receiptWrap">
  <div class="receipt-actions">
    <button class="btn" onclick="backFromReceipt()">← 返回</button>
    <button class="btn primary" onclick="window.print()">列印 / 存 PDF</button>
  </div>
  <div class="receipt" id="receipt"></div>
</div>

const KEY="labor_people_v1", RKEY="labor_records_v1";
let people = load(KEY) || seed();
let records = load(RKEY) || [];
function load(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}}
function save(){localStorage.setItem(KEY,JSON.stringify(people));localStorage.setItem(RKEY,JSON.stringify(records));}
function seed(){return [{id:uid(),name:"珍妮",en:"Jenny",pid:"A123456789",card:"IT-001",phone:"0912-345-678",
  email:"leo@example.com",addr:"台北市信義區信義路五段7號",type:"本國人士",income:"9A-90",
  union:"否",nhi:"是",bank:"玉山銀行 808",branch:"信義分行",acct:"0123-456-78901"}];}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

function switchTab(t){
  ['home','people','issue','records'].forEach(k=>{
    document.getElementById('view'+cap1(k)).style.display=(k===t)?'block':'none';
    document.getElementById('tab'+cap1(k)).classList.toggle('on',k===t);
  });
  if(t==='issue')refreshPersonSelect();
  if(t==='records')renderRecords();
}
function cap1(s){return s.charAt(0).toUpperCase()+s.slice(1);}

function renderPeople(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const list=people.filter(p=>!q||[p.name,p.en,p.pid,p.card].join(' ').toLowerCase().includes(q));
  const el=document.getElementById('peopleTable');
  if(!list.length){el.innerHTML='<div class="empty">沒有符合的人員。點「＋ 新增人員」建立第一筆。</div>';return;}
  let h='<table><thead><tr><th>姓名</th><th>身份證/護照</th><th>工作卡號</th><th>身份別</th><th>銀行帳號</th><th></th></tr></thead><tbody>';
  list.forEach(p=>{
    const t=p.type==='外籍人士'?'<span class="tag foreign">外籍</span>':'<span class="tag local">本國</span>';
    h+=`<tr><td><b>${esc(p.name)}</b> <span class="muted">${esc(p.en||'')}</span></td>
      <td>${esc(p.pid)}</td><td>${esc(p.card||'—')}</td><td>${t}</td>
      <td class="muted">${esc(p.bank||'')} ${esc(p.acct||'')}</td>
      <td style="text-align:right;white-space:nowrap;">
        <button class="btn ghost sm" onclick="useForIssue('${p.id}')">開單</button>
        <button class="btn ghost sm" onclick="openForm('${p.id}')">編輯</button>
        <button class="btn ghost sm del" onclick="delPerson('${p.id}')">刪除</button></td></tr>`;
  });
  el.innerHTML=h+'</tbody></table>';
}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function openForm(id){
  const p=id?people.find(x=>x.id===id):null;
  document.getElementById('formTitle').textContent=p?'編輯人員':'新增人員';
  document.getElementById('fId').value=p?p.id:'';
  set('fName',p&&p.name);set('fEn',p&&p.en);set('fId2',p&&p.pid);set('fCard',p&&p.card);
  set('fPhone',p&&p.phone);set('fEmail',p&&p.email);set('fAddr',p&&p.addr);
  document.getElementById('fType').value=(p&&p.type)||'本國人士';
  document.getElementById('fIncome').value=(p&&p.income)||'9A-90';
  document.getElementById('fUnion').value=(p&&p.union)||'否';
  document.getElementById('fNhi').value=(p&&p.nhi)||'是';
  set('fBank',p&&p.bank);set('fBranch',p&&p.branch);set('fAcct',p&&p.acct);
  document.getElementById('formMask').classList.add('show');
}
function set(id,v){document.getElementById(id).value=v||'';}
function gv(id){return document.getElementById(id).value.trim();}
function closeForm(){document.getElementById('formMask').classList.remove('show');}
function savePerson(){
  const name=gv('fName'),pid=gv('fId2');
  if(!name||!pid){alert('請填中文姓名與身份證/護照字號');return;}
  const id=gv('fId');
  const data={id:id||uid(),name,en:gv('fEn'),pid,card:gv('fCard'),phone:gv('fPhone'),email:gv('fEmail'),
    addr:gv('fAddr'),type:gv('fType'),income:gv('fIncome'),union:gv('fUnion'),nhi:gv('fNhi'),
    bank:gv('fBank'),branch:gv('fBranch'),acct:gv('fAcct')};
  if(id){people=people.map(p=>p.id===id?data:p);}else{people.push(data);}
  save();closeForm();renderPeople();refreshPersonSelect();
}
function delPerson(id){
  const p=people.find(x=>x.id===id);
  if(confirm(`確定刪除「${p.name}」？`)){people=people.filter(x=>x.id!==id);save();renderPeople();refreshPersonSelect();}
}

function refreshPersonSelect(){
  const s=document.getElementById('isPerson');const cur=s.value;
  s.innerHTML='<option value="">— 請選擇 —</option>'+people.map(p=>`<option value="${p.id}">${esc(p.name)} ${esc(p.en||'')} (${esc(p.pid)})</option>`).join('');
  if(people.find(p=>p.id===cur))s.value=cur;
}
function useForIssue(id){switchTab('issue');document.getElementById('isPerson').value=id;fillFromPerson();}
function curPerson(){return people.find(p=>p.id===document.getElementById('isPerson').value);}
function fillFromPerson(){
  const p=curPerson();
  if(p){document.getElementById('isIncome').value=p.income||'9A-90';
    document.getElementById('personMeta').innerHTML=`身份別：<b>${p.type}</b>　工會：${p.union}　健保：${p.nhi}　戶籍：${esc(p.addr||'—')}`;}
  else document.getElementById('personMeta').innerHTML='';
  recalc();
}
const roundFn=Math.round;
function calcDeduction(p,amount){
  let tax=0,nhi=0,taxLabel='代扣所得稅';
  if(!p||!amount)return{tax:0,nhi:0,real:amount||0,taxLabel};
  if(p.type==='外籍人士'){taxLabel='代扣 20% 所得稅';tax=roundFn(amount*0.20);
    if(amount>=20000&&p.nhi==='是')nhi=roundFn(amount*0.0211);}
  else{taxLabel='代扣 10% 所得稅';if(amount>=20010)tax=roundFn(amount*0.10);
    if(amount>=20000&&p.union!=='是')nhi=roundFn(amount*0.0211);}
  return{tax,nhi,real:amount-tax-nhi,taxLabel};
}
function recalc(){
  const p=curPerson();const amt=parseFloat(document.getElementById('isAmount').value)||0;
  const d=calcDeduction(p,amt);
  document.getElementById('cAmount').textContent=amt?money(amt):'—';
  document.getElementById('cTaxLbl').textContent=d.taxLabel;
  document.getElementById('cTax').textContent=d.tax?'- '+money(d.tax):'—';
  document.getElementById('cNhi').textContent=d.nhi?'- '+money(d.nhi):'—';
  document.getElementById('cReal').textContent=amt?money(d.real):'—';
  document.getElementById('cCap').textContent=amt?('新台幣 '+capAmount(d.real)):'';
}
function money(n){return 'NT$ '+Math.round(n).toLocaleString('en-US');}
const CAP=['零','壹','貳','參','肆','伍','陸','柒','捌','玖'];
function capInt(n){if(n===0)return '';let u=['','拾','佰','仟'],i=0,arr=[];
  while(n>0){arr.unshift({d:n%10,u:u[i++]});n=Math.floor(n/10);}
  let s='';arr.forEach(x=>{s+=(x.d===0?'零':CAP[x.d]+x.u);});return s.replace(/零+/g,'零').replace(/零$/,'');}
function capAmount(n){n=Math.round(n);if(n<=0)return '零元整';
  const wan=Math.floor(n/10000),rest=n%10000;let s='';
  if(wan>0)s+=capInt(wan)+'萬';if(rest>0){if(wan>0&&rest<1000)s+='零';s+=capInt(rest);}return s+'元整';}
function capBoxes(n){n=Math.round(n);
  return{wan:Math.floor(n/10000)>0?capInt(Math.floor(n/10000)):'零',
    tho:CAP[Math.floor(n/1000)%10],hun:CAP[Math.floor(n/100)%10],ten:CAP[Math.floor(n/10)%10],units:CAP[n%10]};}

function generate(){
  const p=curPerson();if(!p){alert('請先選擇人員');return;}
  const amt=parseFloat(document.getElementById('isAmount').value)||0;if(!amt){alert('請輸入應付總金額');return;}
  const d=calcDeduction(p,amt);
  buildReceipt({p,amt,tax:d.tax,nhi:d.nhi,real:d.real,
    fill:document.getElementById('isFillDate').value,end:document.getElementById('isEndDate').value,
    reason:document.getElementById('isReason').value,income:document.getElementById('isIncome').value});
}

  const ymd=s=>{if(!s)return{y:'　　',m:'　',d:'　'};const a=s.split('-');return{y:a[0],m:a[1],d:a[2]};};const f=ymd(o.fill);
  document.getElementById('receipt').innerHTML=`

      <tr><td class="lbl">戶籍地址</td><td colspan="5">${esc(p.addr||'')}</td></tr></tbody></table>
    <div class="line-field"><b>工作結案日期：</b><span class="u">${esc(o.end||'　')}</span></div>
    <div class="line-field"><b>領 款 事 由：</b><span class="u">${esc(o.reason||'　')}</span></div>
    <div class="mid">
      <div class="left">

function storeRecord(){
  const p=curPerson();const amt=parseFloat(document.getElementById('isAmount').value)||0;
  if(!p||!amt){alert('請先選擇人員並輸入金額');return;}
  const d=calcDeduction(p,amt);
  records.push({id:uid(),fillDate:document.getElementById('isFillDate').value,endDate:document.getElementById('isEndDate').value,
    personId:p.id,name:p.name,pid:p.pid,reason:document.getElementById('isReason').value,
    amount:amt,type:p.type,income:document.getElementById('isIncome').value,tax:d.tax,nhi:d.nhi,real:d.real});
  save();alert('已存入紀錄（共 '+records.length+' 筆），可到「開單紀錄」分頁查看');renderRecords();
}

function renderRecords(){
  const q=(document.getElementById('rSearch').value||'').toLowerCase();
  const list=records.filter(r=>!q||[r.name,r.reason].join(' ').toLowerCase().includes(q)).slice().reverse();
  const el=document.getElementById('recordsTable');
  if(!list.length){el.innerHTML='<div class="empty">還沒有紀錄。到「開立勞務單」按「存入紀錄」就會出現在這裡。</div>';return;}
  let h='<table><thead><tr><th>填單日期</th><th>姓名</th><th>事由</th><th class="num">應付</th><th class="num">所得稅</th><th class="num">健保</th><th class="num">實領</th><th></th></tr></thead><tbody>';
  list.forEach(r=>{
    h+=`<tr><td>${esc(r.fillDate||'')}</td><td><b>${esc(r.name)}</b></td><td class="muted">${esc(r.reason||'')}</td>
      <td class="num">${num(r.amount)}</td><td class="num">${num(r.tax)}</td><td class="num">${num(r.nhi)}</td><td class="num"><b>${num(r.real)}</b></td>
      <td style="text-align:right;white-space:nowrap;">
        <button class="btn ghost sm" onclick="reprint('${r.id}')">重印</button>
        <button class="btn ghost sm del" onclick="delRecord('${r.id}')">刪除</button></td></tr>`;
  });
  el.innerHTML=h+'</tbody></table>';
}
function num(n){n=Number(n)||0;return n.toLocaleString('en-US');}
function reprint(id){
  const r=records.find(x=>x.id===id);if(!r)return;
  const p=people.find(x=>x.id===r.personId)||{name:r.name,pid:r.pid,type:r.type};
  buildReceipt({p,amt:Number(r.amount),tax:Number(r.tax),nhi:Number(r.nhi),real:Number(r.real),
    fill:r.fillDate,end:r.endDate,reason:r.reason,income:r.income});
}
function delRecord(id){
  if(!confirm('確定刪除這筆紀錄？'))return;
  records=records.filter(x=>x.id!==id);save();renderRecords();
}
function exportCSV(){
  if(!records.length){alert('目前沒有紀錄可匯出');return;}
  const cols=[['fillDate','填單日期'],['endDate','結案日期'],['name','姓名'],['pid','身份證/護照'],
    ['reason','領款事由'],['type','身份別'],['income','所得類別'],['amount','應付總額'],['tax','代扣所得稅'],['nhi','代扣健保'],['real','實領金額']];
  const head=cols.map(c=>c[1]).join(',');
  const body=records.map(r=>cols.map(c=>csvCell(r[c[0]])).join(',')).join('\n');
  const csv='\uFEFF'+head+'\n'+body;
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='勞務紀錄_'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
}
function csvCell(v){v=(v==null?'':String(v));return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
